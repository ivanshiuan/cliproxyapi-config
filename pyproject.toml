[project]
name = "devswarm"
version = "0.1.0"
description = "LangGraph-based AI agent swarm — the factory that builds the Taiwan restaurant SaaS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Commander" }]

dependencies = [
    # DevSwarm core
    "anthropic>=0.40.0,<1.0",
    "langgraph>=0.2.50,<1.0",
    "pydantic>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.7,<15.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=7.0,<8.0",
    # Restaurant API (Phase 1)
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.5,<3.0",
    "greenlet>=3.0,<4.0",
    "pgvector>=0.3,<1.0",
    "apscheduler>=3.10,<4.0",
    "qrcode>=7.4,<9.0",
]

[project.scripts]
devswarm = "devswarm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devswarm*", "restaurant_api*"]
exclude = ["tests*", "workspace*", "docs*", "specs*"]

# ──────────────────────────────────────────────────────────────────────────
# Tooling
# ──────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires ANTHROPIC_API_KEY and network",
    "needs_db: requires a reachable Postgres at RESTO_DB_*",
]
filterwarnings = [
    # LangChain's serializer plugin emits a pending-deprecation on import.
    # Not our code; harmless until LangGraph 1.0.
    "ignore::DeprecationWarning:langgraph.cache.base",
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    # Starlette renamed HTTP_422_UNPROCESSABLE_ENTITY → ..._CONTENT in 0.40.
    # We use the literal 422 constant; this filter just keeps the test output clean.
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning",
]

# ──────────────────────────────────────────────────────────────────────────
# Coverage — pytest-cov / coverage.py
# ──────────────────────────────────────────────────────────────────────────
# ``make coverage`` runs the full suite with line + branch tracking and a
# term-missing summary so untested branches surface directly in CI logs.
# The HTML report drops into ``htmlcov/`` for local inspection.

[tool.coverage.run]
branch = true
source = ["restaurant_api", "devswarm"]
omit = [
    # Autogenerated / runtime-injected — coverage of these is uninformative.
    "restaurant_api/alembic/versions/*",
    # Stub seam — exercised end-to-end via the real DI in router tests,
    # not by direct unit tests; coverage would penalise the contract.
    "restaurant_api/integrations/line/messenger.py",
    "*/__init__.py",
]

[tool.coverage.report]
# Don't fail-under here — surfacing the number first, then we ratchet up.
# Exclude the usual unreachable / defensive lines from the % to keep the
# signal high.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # protocol method bodies
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
show_missing = true
skip_covered = false
precision = 1
sort = "-Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Demo + seed scripts deliberately use 中文標點 in user-facing prints.
"scripts/demo_flow.py" = ["RUF001"]
"scripts/seed_demo_data.py" = ["RUF001"]
"scripts/seed_wheel_campaign.py" = ["RUF001"]
"scripts/seed_growth_demo.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

# ──────────────────────────────────────────────────────────────────────────
# Type checking — pyright in basic mode. We're not aiming for `strict` yet
# because SQLAlchemy 2.x typing and async generator stub interplay still
# trip strict mode on legitimate code. Basic mode catches real bugs (wrong
# argument types, missing returns, name errors) without false positives.
# ──────────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["devswarm", "restaurant_api", "scripts"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    ".venv",
    "workspace",
    "tests",  # tests have lots of monkey-patched mocks; skip
    "restaurant_api/alembic/versions",  # autogenerated; alembic runtime injection
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
# Look up packages from the venv first.
venvPath = "."
venv = ".venv"
# These are noisy on legitimate code (SQLAlchemy descriptor protocol,
# TypedDict total=False access pattern, alembic runtime ``op`` / ``context``).
reportMissingTypeStubs = false
reportTypedDictNotRequiredAccess = false
reportAttributeAccessIssue = "warning"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
