[project]
name = "devswarm"
version = "0.1.0"
description = "LangGraph-based AI agent swarm — the factory that builds the Taiwan restaurant SaaS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Commander" }]

dependencies = [
    # DevSwarm core
    "anthropic>=0.40.0,<1.0",
    "langgraph>=0.2.50,<1.0",
    "pydantic>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.7,<15.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    # Restaurant API (Phase 1)
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.5,<3.0",
    "greenlet>=3.0,<4.0",
    "pgvector>=0.3,<1.0",
]

[project.scripts]
devswarm = "devswarm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devswarm*", "restaurant_api*"]
exclude = ["tests*", "workspace*", "docs*", "specs*"]

# ──────────────────────────────────────────────────────────────────────────
# Tooling
# ──────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires ANTHROPIC_API_KEY and network",
    "needs_db: requires a reachable Postgres at RESTO_DB_*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

# ──────────────────────────────────────────────────────────────────────────
# Type checking — pyright in basic mode. We're not aiming for `strict` yet
# because SQLAlchemy 2.x typing and async generator stub interplay still
# trip strict mode on legitimate code. Basic mode catches real bugs (wrong
# argument types, missing returns, name errors) without false positives.
# ──────────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["devswarm", "restaurant_api", "scripts"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    ".venv",
    "workspace",
    "tests",  # tests have lots of monkey-patched mocks; skip
    "restaurant_api/alembic/versions",  # autogenerated; alembic runtime injection
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
# Look up packages from the venv first.
venvPath = "."
venv = ".venv"
# These are noisy on legitimate code (SQLAlchemy descriptor protocol,
# TypedDict total=False access pattern, alembic runtime ``op`` / ``context``).
reportMissingTypeStubs = false
reportTypedDictNotRequiredAccess = false
reportAttributeAccessIssue = "warning"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
