<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付款結果 — car16</title>
<link rel="stylesheet" href="../css/main.css">
</head>
<body>
<main style="max-width:520px">
  <div class="card" style="text-align:center" id="box">
    <h2 id="title">處理中…</h2>
    <p class="muted" id="detail"></p>
    <a class="btn" href="../dashboard.html">前往會員中心</a>
  </div>
  <div class="notice">方案開通以綠界付款通知為準（通常數秒內）；ATM 轉帳約 1-3 個工作天入帳後自動開通。可到會員中心查看最新狀態。</div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/chatbot.js"></script>
<script src="../js/ui.js"></script>
<script>
// 綠界 OrderResultURL 以 POST 導回 → 瀏覽器端讀不到 body；
// 這頁僅顯示引導文字，實際狀態以 /api/me/billing 為準。
(async function () {
  const title = document.getElementById("title");
  const detail = document.getElementById("detail");
  if (!api.token()) { title.textContent = "付款已送出"; detail.textContent = "請登入後至會員中心確認開通狀態。"; return; }
  try {
    const d = await api.get("/api/me/billing");
    const latest = d.payments[0];
    if (!latest) { title.textContent = "沒有找到訂單"; return; }
    if (latest.status === "paid") {
      title.textContent = "✅ 付款成功，方案已開通";
      detail.textContent = `訂單 ${latest.merchant_trade_no} · NT$${latest.amount_twd}`;
    } else if (latest.atm_v_account) {
      title.textContent = "🏦 請完成 ATM 轉帳";
      detail.textContent = `銀行代碼 ${latest.atm_bank_code}｜虛擬帳號 ${latest.atm_v_account}｜繳費期限 ${latest.atm_expire_date}`;
    } else {
      title.textContent = "付款處理中";
      detail.textContent = "若已完成付款，開通通常在數秒內生效，稍後重新整理即可。";
    }
  } catch (e) {
    title.textContent = "無法取得訂單狀態";
    detail.textContent = e.message;
  }
})();
</script>
</body>
</html>
