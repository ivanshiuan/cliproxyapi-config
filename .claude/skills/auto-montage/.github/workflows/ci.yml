name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Subtitle-gate tests
        run: python -m pytest tests/ -v

      - name: Compile scripts
        run: python -m py_compile scripts/subtitle_align_check.py

      - name: Shell syntax check
        run: bash -n scripts/preflight.sh

      - name: Install ffmpeg + CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: End-to-end demo (render + gate)
        run: bash examples/demo_bilingual_short.sh

      - name: Assert demo output exists
        run: test -s examples/out/demo_bilingual_short.mp4
