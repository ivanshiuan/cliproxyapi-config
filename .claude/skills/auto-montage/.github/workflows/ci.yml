name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Subtitle-gate tests
        run: python -m pytest tests/ -v

      - name: Compile scripts
        run: python -m py_compile scripts/subtitle_align_check.py

      - name: Shell syntax check
        run: bash -n scripts/preflight.sh
