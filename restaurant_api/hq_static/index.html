<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>總部儀表板</title>
<style>
  :root { --bg: #0f1115; --card: #1a1d24; --card2: #22262f; --ink: #eceff4;
          --sub: #8b93a1; --accent: #4c8dff; --ok: #22c55e; --line: #2c303a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
         background: var(--bg); color: var(--ink); min-height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 20px 28px;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 22px; }
  header .sub { color: var(--sub); font-size: 14px; }
  .spacer { flex: 1; }
  .datebar { display: flex; align-items: center; gap: 8px; }
  .datebar input { background: var(--card2); border: 1px solid var(--line); color: var(--ink);
                    border-radius: 8px; padding: 7px 10px; font-size: 14px; }
  .datebar button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
                     padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  main { padding: 24px 28px; max-width: 960px; margin: 0 auto; }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px; margin-bottom: 24px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .tile .label { color: var(--sub); font-size: 13px; margin-bottom: 6px; }
  .tile .value { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px;
          overflow: hidden; border: 1px solid var(--line); }
  th, td { padding: 12px 16px; text-align: left; font-size: 14px; }
  th { background: var(--card2); color: var(--sub); font-weight: 600; font-size: 13px; }
  tbody tr:not(:last-child) { border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank { color: var(--sub); width: 32px; }
  .rank.top1 { color: #fbbf24; font-weight: 800; }
  .storename { font-weight: 600; }
  .empty { color: var(--sub); text-align: center; padding: 60px 0; font-size: 16px; }
</style>
</head>
<body>
<header>
  <h1>🏢 總部儀表板</h1>
  <span class="sub" id="rangeLabel"></span>
  <span class="spacer"></span>
  <div class="datebar">
    <input type="date" id="dateFrom" />
    <span class="sub">～</span>
    <input type="date" id="dateTo" />
    <button id="applyBtn">套用</button>
  </div>
</header>

<main>
  <div class="totals" id="totals"></div>
  <div id="tableWrap"><div class="empty">載入中…</div></div>
</main>

<script>
// /hq/?date_from=&date_to= — owner/HQ view, no store_id (spans every active
// store under the tenant). Read-only; ranked purely off /reports/hq.
const API = "";
const $ = (id) => document.getElementById(id);
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function money(n) { return "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 }); }

async function api(path) {
  const res = await fetch(API + path);
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.error?.message || detail; } catch (e) { /* ignore */ }
    throw new Error(detail);
  }
  return res.json();
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

async function load() {
  const from = $("dateFrom").value || todayStr();
  const to = $("dateTo").value;
  $("tableWrap").innerHTML = `<div class="empty">載入中…</div>`;
  try {
    const qs = new URLSearchParams({ date_from: from });
    if (to) qs.set("date_to", to);
    const d = await api(`/reports/hq?${qs.toString()}`);
    render(d);
  } catch (e) {
    $("tableWrap").innerHTML = `<div class="empty">載入失敗: ${escapeHtml(e.message)}</div>`;
  }
}

function render(d) {
  $("rangeLabel").textContent = d.date_from === d.date_to ? d.date_from : `${d.date_from} ~ ${d.date_to}`;
  $("totals").innerHTML = `
    <div class="tile"><div class="label">門市數</div><div class="value">${d.store_count}</div></div>
    <div class="tile"><div class="label">全店訂單數</div><div class="value">${d.total_order_count}</div></div>
    <div class="tile"><div class="label">全店淨營收</div><div class="value">${money(d.total_net_sales)}</div></div>
  `;
  if (!d.stores.length) {
    $("tableWrap").innerHTML = `<div class="empty">這個租戶還沒有門市，或這個區間沒有已關閉的訂單</div>`;
    return;
  }
  $("tableWrap").innerHTML = `
    <table>
      <thead><tr>
        <th class="rank">#</th><th>門市</th>
        <th class="num">訂單數</th><th class="num">毛營收</th><th class="num">淨營收</th><th class="num">客單價</th>
      </tr></thead>
      <tbody>
        ${d.stores.map((s, i) => `<tr>
          <td class="rank${i === 0 && Number(s.net_sales) > 0 ? " top1" : ""}">${i + 1}</td>
          <td class="storename">${escapeHtml(s.store_name)}</td>
          <td class="num">${s.order_count}</td>
          <td class="num">${money(s.gross_sales)}</td>
          <td class="num">${money(s.net_sales)}</td>
          <td class="num">${money(s.avg_ticket)}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
}

$("dateFrom").value = todayStr();
$("applyBtn").onclick = load;
load();
</script>
</body>
</html>
