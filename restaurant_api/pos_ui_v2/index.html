<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>iCHEF 級 POS · 台北信義店</title>
<style>
/* ═══ Apple HIG skin — light-first, full dark mode, iOS system colors ═══ */
:root{
  --bg:#F2F2F7; --surf:#FFFFFF; --surf2:#F7F7F9; --key:#EDEDF0;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --line:rgba(60,60,67,.1); --line2:rgba(60,60,67,.2);
  --ink:#1C1C1E; --ink2:rgba(60,60,67,.64); --ink3:rgba(60,60,67,.4);
  --cta:#1C1C1E; --cta-ink:#FFFFFF;
  --st-new:#FF3B30; --st-kitchen:#FF9500; --st-served:#34C759; --st-paid:#007AFF; --st-empty:#C7C7CC;
  --danger:#FF3B30; --ok:#34C759;
  --glass:rgba(249,249,251,.82);
  --r:16px; --r2:24px;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --shadow-pop:0 24px 70px rgba(0,0,0,.26);
  --ease:cubic-bezier(.25,.1,.25,1);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --surf:#1C1C1E; --surf2:#242426; --key:#2C2C2E;
  --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
  --line:rgba(84,84,88,.48); --line2:rgba(84,84,88,.7);
  --ink:#F2F2F7; --ink2:rgba(235,235,245,.64); --ink3:rgba(235,235,245,.34);
  --cta:#FFFFFF; --cta-ink:#000000;
  --st-new:#FF453A; --st-kitchen:#FF9F0A; --st-served:#30D158; --st-paid:#0A84FF; --st-empty:#3A3A3C;
  --danger:#FF453A; --ok:#30D158;
  --glass:rgba(24,24,26,.76);
  --shadow-card:0 1px 2px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.35);
  --shadow-pop:0 24px 70px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); overflow:hidden;
  -webkit-font-smoothing:antialiased; font-size:16px;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── top bar: frosted glass, hairline ── */
.topbar{display:flex;align-items:center;gap:16px;padding:12px 20px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.brand .dot{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  background:var(--cta);color:var(--cta-ink);font-size:16px}
.brand small{font-weight:400;color:var(--ink3);font-size:12px;letter-spacing:0}
.tabs{display:flex;gap:2px;margin-left:6px;background:var(--fill);padding:2.5px;border-radius:10px}
.tab{padding:8px 20px;border-radius:8px;color:var(--ink2);font-size:14.5px;font-weight:600;cursor:pointer;border:0;background:none;transition:color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease);white-space:nowrap}
.tab.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.spacer{flex:1}
.clock{font-size:15px;color:var(--ink2);font-weight:600;letter-spacing:.2px}
.who{display:flex;align-items:center;gap:9px;padding:6px 13px 6px 7px;background:var(--fill);border-radius:99px;font-size:13.5px;font-weight:500}
.who .av{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#5E9CFB,#3C6DF0);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}

/* ── screens ── */
.screen{flex:1;overflow:hidden;display:none}
.screen.on{display:flex}

/* ── floor plan ── */
.floor-wrap{flex:1;overflow-y:auto;padding:22px 24px 44px}
.zone-head{display:flex;align-items:center;gap:12px;margin:4px 2px 14px}
.zone-head:not(:first-child){margin-top:30px}
.zone-head h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.zone-head .cnt{font-size:13px;color:var(--ink2);background:var(--fill);padding:3px 11px;border-radius:99px;font-weight:600}
.zone-head .rule{flex:1}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-left:auto}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:500}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.floor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tcard{position:relative;background:var(--surf);border-radius:var(--r);box-shadow:var(--shadow-card);
  padding:16px 16px 14px 19px;cursor:pointer;min-height:116px;overflow:hidden;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
  display:flex;flex-direction:column;border:.5px solid var(--line)}
.tcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.09)}
.tcard:active{transform:scale(.975)}
.tcard .strip{position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.tcard.new .strip{background:var(--st-new)}
.tcard.kitchen .strip{background:var(--st-kitchen)}
.tcard.served .strip{background:var(--st-served)}
.tcard.paid .strip{background:var(--st-paid)}
.tcard .nm{font-size:22px;font-weight:700;letter-spacing:-.3px}
.tcard .meta{display:flex;gap:12px;margin-top:6px;color:var(--ink3);font-size:13px}
.tcard .meta b{color:var(--ink2);font-weight:600}
.tcard .amt{margin-top:auto;padding-top:10px;font-size:20px;font-weight:700;letter-spacing:-.3px}
.tcard.empty .amt{color:var(--ink3);font-size:13.5px;font-weight:500}
.tcard .pill{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;padding:3.5px 9px;border-radius:99px;letter-spacing:.2px}
.tcard.new .pill{background:color-mix(in srgb,var(--st-new) 14%,transparent);color:var(--st-new)}
.tcard.kitchen .pill{background:color-mix(in srgb,var(--st-kitchen) 15%,transparent);color:var(--st-kitchen)}
.tcard.served .pill{background:color-mix(in srgb,var(--st-served) 15%,transparent);color:var(--st-served)}
.tcard.paid .pill{background:color-mix(in srgb,var(--st-paid) 13%,transparent);color:var(--st-paid)}

/* ── order screen ── */
.order{flex:1;display:flex;overflow:hidden}
.bill{width:37%;min-width:340px;max-width:440px;background:var(--surf);border-right:.5px solid var(--line);
  display:flex;flex-direction:column}
.bill-top{padding:18px 20px 14px;border-bottom:.5px solid var(--line)}
.bill-top .r1{display:flex;align-items:center;justify-content:space-between}
.bill-top h3{font-size:24px;font-weight:700;letter-spacing:-.4px}
.bill-top .back{background:var(--fill);border:0;color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;transition:background .15s var(--ease)}
.bill-top .back:active{background:var(--fill2)}
.bill-top .sub{color:var(--ink3);font-size:13px;margin-top:5px;display:flex;gap:14px}
.bill-top .sub b{color:var(--ink2);font-weight:600}
.lines{flex:1;overflow-y:auto;padding:8px 12px}
.line{display:flex;gap:12px;padding:12px 10px;border-radius:12px;transition:background .14s var(--ease)}
.line:hover{background:var(--surf2)}
.line .q{flex:0 0 30px;height:30px;border-radius:9px;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.line .body{flex:1;min-width:0}
.line .nm{font-size:16px;font-weight:600;letter-spacing:-.2px}
.line .mod{font-size:12.5px;color:var(--ink3);margin-top:2px}
.line .price{font-weight:600;font-size:15.5px;align-self:flex-start;margin-top:2px}
.line .rm{background:none;border:0;color:var(--ink3);font-size:16px;cursor:pointer;padding:2px 4px;align-self:flex-start;border-radius:6px}
.line .rm:hover{color:var(--danger)}
.empty-bill{color:var(--ink3);text-align:center;padding:60px 20px;font-size:14.5px;line-height:1.7}
.bill-foot{border-top:.5px solid var(--line);padding:14px 20px 18px;background:var(--surf)}
.foot-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);padding:3px 0}
.foot-row.promo{color:var(--st-served);font-weight:600}
.foot-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:11px;border-top:.5px solid var(--line)}
.foot-total .lb{font-size:14px;color:var(--ink2)}
.foot-total .v{font-size:36px;font-weight:700;letter-spacing:-1px}
.foot-act{display:flex;gap:10px;margin-top:15px}
.btn{border:0;border-radius:14px;font-weight:600;cursor:pointer;font-size:16.5px;transition:transform .15s var(--ease),opacity .15s var(--ease),background .15s var(--ease);letter-spacing:-.2px}
.btn:active{transform:scale(.97)}
.btn-lg{height:54px}
.btn-primary{background:var(--cta);color:var(--cta-ink);flex:2}
.btn-ghost{background:var(--fill);color:var(--ink);flex:1}
.btn-ghost:active{background:var(--fill2)}
.btn-primary:disabled,.btn-ghost:disabled{opacity:.35;cursor:not-allowed}

.menu{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.cats{display:flex;gap:8px;padding:16px 22px 12px;overflow-x:auto}
.cat{padding:9px 18px;border-radius:99px;background:var(--surf);border:.5px solid var(--line);color:var(--ink2);font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .16s var(--ease),color .16s var(--ease);box-shadow:var(--shadow-card)}
.cat.on{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.grid-menu{flex:1;overflow-y:auto;padding:12px 22px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:13px;align-content:start}
.mtile{background:var(--surf);border:.5px solid var(--line);border-radius:var(--r);padding:15px 15px 13px;cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s var(--ease);min-height:100px;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow-card)}
.mtile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.09)}
.mtile:active{transform:scale(.965)}
.mtile .emo{font-size:25px;margin-bottom:auto}
.mtile .nm{font-weight:600;font-size:15.5px;margin-top:9px;letter-spacing:-.2px}
.mtile .pr{color:var(--ink2);font-weight:600;font-size:14.5px;margin-top:4px}
.mtile .badge{position:absolute;top:11px;right:11px;background:var(--st-paid);color:#fff;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;box-shadow:0 2px 8px color-mix(in srgb,var(--st-paid) 40%,transparent)}
.mtile.soldout{opacity:.4;pointer-events:none}
.mtile.soldout::after{content:"售完";position:absolute;top:11px;right:11px;font-size:11px;font-weight:700;color:var(--ink3);background:var(--fill);padding:2px 9px;border-radius:99px}

/* ── checkout sheet ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.on{display:flex}
.sheet{background:var(--bg);border-radius:var(--r2);width:100%;max-width:560px;box-shadow:var(--shadow-pop);overflow:hidden;animation:sheetIn .32s var(--ease)}
@keyframes sheetIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 12px;position:relative}
.sheet-h::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:38px;height:5px;border-radius:3px;background:var(--fill2)}
.sheet-h h3{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-top:6px}
.sheet-h .x{background:var(--fill);border:0;color:var(--ink2);width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;margin-top:6px}
.co-body{padding:8px 22px 20px}
.co-due{background:var(--surf);border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;box-shadow:var(--shadow-card)}
.co-due .lb{color:var(--ink2);font-size:14px;font-weight:500}
.co-due .v{font-size:38px;font-weight:700;letter-spacing:-1px}
.co-disp{background:var(--surf);border-radius:var(--r);padding:13px 18px;margin-bottom:13px;text-align:right;box-shadow:var(--shadow-card)}
.co-disp .lb{font-size:12px;color:var(--ink3);text-align:left;font-weight:500}
.co-disp .tender{font-size:31px;font-weight:700;min-height:39px;letter-spacing:-.5px}
.co-disp .change{font-size:14px;color:var(--ok);font-weight:600;margin-top:3px;min-height:20px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:11px}
.quick button{height:50px;border-radius:13px;background:var(--surf);border:.5px solid var(--line);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;transition:transform .13s var(--ease),background .13s var(--ease);box-shadow:var(--shadow-card)}
.quick button:active{transform:scale(.955);background:var(--key)}
.quick button.exact{background:color-mix(in srgb,var(--ok) 12%,var(--surf));border-color:color-mix(in srgb,var(--ok) 36%,transparent);color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pad button{height:56px;border-radius:13px;background:var(--key);border:0;color:var(--ink);font-size:23px;font-weight:500;cursor:pointer;transition:transform .12s var(--ease),filter .12s var(--ease)}
.pad button:active{transform:scale(.955);filter:brightness(.93)}
.co-pay{display:flex;gap:8px;margin-top:15px}
.pay-m{flex:1;height:44px;border-radius:99px;background:var(--fill);border:1.5px solid transparent;color:var(--ink2);font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s var(--ease),color .15s var(--ease)}
.pay-m.on{border-color:var(--ink);color:var(--ink);background:var(--surf)}
.co-foot{padding:14px 22px 20px;display:flex;gap:10px}

/* modifier sheet */
.mod-opts{display:flex;flex-direction:column;gap:9px;margin:4px 0 6px}
.mod-opt{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surf);border:1.5px solid transparent;border-radius:14px;cursor:pointer;font-size:15.5px;box-shadow:var(--shadow-card)}
.mod-opt.sel{border-color:var(--ink)}
.mod-opt .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
.mod-opt.sel .ck{border-color:var(--ink);background:var(--ink);position:relative}
.mod-opt.sel .ck::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:var(--surf);font-size:13px;font-weight:800}

/* ── KDS ── */
.kds-wrap{flex:1;overflow-y:auto;padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;align-content:start;background:var(--bg)}
.ticket{background:var(--surf);border-radius:var(--r);overflow:hidden;border-top:4px solid var(--st-kitchen);box-shadow:var(--shadow-card)}
.ticket.rush{border-top-color:var(--st-new);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:var(--shadow-card)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--st-new) 22%,transparent)}}
.tk-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--line)}
.tk-h .t{font-weight:700;font-size:17px;letter-spacing:-.2px}
.tk-h .clk{font-size:12.5px;color:var(--ink3);font-weight:600}
.tk-body{padding:10px 16px}
.tk-item{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px;border-bottom:.5px solid var(--line)}
.tk-item:last-child{border:0}
.tk-item .q{color:var(--st-kitchen);font-weight:700}
.tk-foot{padding:11px 14px 14px}
.tk-done{width:100%;height:44px;border-radius:12px;background:var(--st-served);color:#fff;border:0;font-weight:700;font-size:15px;cursor:pointer;transition:transform .14s var(--ease)}
.tk-done:active{transform:scale(.97)}

/* ── reports ── */
.rep-wrap{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surf);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-card);border:.5px solid var(--line)}
.kpi .lb{color:var(--ink2);font-size:13px;font-weight:500}
.kpi .v{font-size:32px;font-weight:700;margin-top:7px;letter-spacing:-1px}
.kpi .d{font-size:12.5px;font-weight:600;margin-top:5px}
.kpi .d.up{color:var(--ok)} .kpi .d.dn{color:var(--danger)} .kpi .d.eq{color:var(--ink3)}
.rep-card{background:var(--surf);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-card);border:.5px solid var(--line)}
.rep-card h3{font-size:16px;font-weight:700;margin-bottom:14px;letter-spacing:-.2px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.bar-row .nm{flex:0 0 92px;font-size:13.5px;color:var(--ink2);font-weight:500}
.bar-track{flex:1;height:24px;background:var(--fill);border-radius:7px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:7px;background:var(--st-paid)}
.bar-row .val{flex:0 0 96px;text-align:right;font-size:13.5px;font-weight:600}
.hours{display:flex;align-items:flex-end;gap:5px;height:130px;padding:0 2px}
.hbar{flex:1;background:var(--fill);border-radius:5px 5px 0 0;position:relative;min-height:4px}
.hbar.peak{background:var(--st-paid)}
.hbar span{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink3)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:.5px solid var(--line);color:var(--ink);padding:12px 24px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;transition:opacity .28s var(--ease),transform .28s var(--ease);z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.18);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.demo-tag{position:fixed;bottom:12px;right:14px;font-size:11px;color:var(--ink3);background:var(--glass);padding:5px 12px;border-radius:99px;z-index:70;border:.5px solid var(--line)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--fill2);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
button:focus-visible,.tcard:focus-visible,.mtile:focus-visible{outline:2.5px solid var(--st-paid);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media(max-width:820px){
  .bill{width:100%;max-width:none;min-width:0}
  .order.showmenu .bill{display:none}
  .order:not(.showmenu) .menu{display:none}
  .tabs .tab{padding:8px 13px;font-size:13.5px}
  .brand small{display:none}
}
</style>
</head>
<body>


<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot">🍜</span><span>雲端 POS<br><small>接真後端 · restaurant_api</small></span></div>
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <div class="clock num" id="clock">--:--</div>
    <div class="who"><span class="av">阿</span><span>阿明 · 外場</span></div>
  </div>

  <!-- 桌況 -->
  <section class="screen on" id="s-floor">
    <div class="floor-wrap">
      <div class="zone-head">
        <h2>內用區</h2><span class="cnt" id="dineCnt"></span><div class="rule"></div>
        <div class="legend">
          <span><i style="background:var(--st-empty)"></i>空桌</span>
          <span><i style="background:var(--st-new)"></i>待送單</span>
          <span><i style="background:var(--st-kitchen)"></i>製作中</span>
          <span><i style="background:var(--st-served)"></i>待結帳</span>
          <span><i style="background:var(--st-paid)"></i>已結帳</span>
        </div>
      </div>
      <div class="floor-grid" id="dineGrid"></div>
      <div class="zone-head"><h2>外帶 / 候位</h2><span class="cnt" id="toCnt"></span><div class="rule"></div></div>
      <div class="floor-grid" id="toGrid"></div>
    </div>
  </section>

  <!-- 點餐 -->
  <section class="screen" id="s-order">
    <div class="order showmenu" id="orderWrap">
      <div class="bill">
        <div class="bill-top">
          <div class="r1"><h3 id="billTitle">A1 桌</h3><button class="back" onclick="backToFloor()">‹</button></div>
          <div class="sub"><span>訂單 <b id="billNo">#—</b></span><span>內用 · <b id="billParty">4</b> 位</span></div>
        </div>
        <div class="lines" id="billLines"></div>
        <div class="bill-foot" id="billFoot"></div>
      </div>
      <div class="menu">
        <div class="cats" id="cats"></div>
        <div class="grid-menu" id="menuGrid"></div>
      </div>
    </div>
  </section>

  <!-- KDS -->
  <section class="screen" id="s-kds"><div class="kds-wrap" id="kdsWrap"></div></section>

  <!-- 報表 -->
  <section class="screen" id="s-rep"><div class="rep-wrap" id="repWrap"></div></section>
</div>

<!-- checkout overlay -->
<div class="overlay" id="ov"><div class="sheet" id="ovSheet"></div></div>
<div class="toast" id="toast"></div>
<div class="demo-tag">/pos-v2 · 接真 REST API</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const API="";
const storeId=new URLSearchParams(location.search).get("store");
const NT=n=>"$"+Math.round(Number(n)).toLocaleString("en-US");
function toast(m){const t=$("toast");t.textContent=m;t.className="toast on";clearTimeout(t._);t._=setTimeout(()=>t.className="toast",2200)}
async function api(path,opts){const r=await fetch(API+path,{headers:{"Content-Type":"application/json"},...opts});
  if(!r.ok){let d=r.statusText;try{const j=await r.json();d=j.error?.message||d}catch(e){}throw new Error(d)}
  return r.status===204?null:r.json()}

/* emoji by keyword (menu items have no emoji field) */
const EMO=[["麵","🍜"],["飯","🍚"],["便當","🍱"],["雞","🍗"],["湯","🥣"],["茶","🧋"],["奶","🥛"],
  ["咖啡","☕"],["菜","🥬"],["肉","🍖"],["魚","🐟"],["蝦","🦐"],["餃","🥟"],["粥","🍲"],
  ["檸","🍋"],["果","🍹"],["酒","🍺"],["蛋","🍳"],["炒","🍳"],["滷","🍢"],["丸","🍡"]];
function emo(n){for(const[k,e]of EMO)if(n.includes(k))return e;return"🍽️"}

const S={store:null,floor:[],menu:[],cats:{},orders:{},cur:null};

/* tabs */
const TABS=[["floor","桌況"],["order","點餐"],["kds","廚房"],["rep","報表"]];
$("tabs").innerHTML=TABS.map(t=>`<button class="tab" data-t="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
function go(k){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===k));
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$("s-"+k).classList.add("on");
  if(k==="floor")loadFloor(); if(k==="kds")loadKDS(); if(k==="rep")loadRep();}

/* ── status derivation ── */
const ST_LABEL={empty:"",new:"待送單",kitchen:"製作中",served:"待結帳",paid:"已結帳"};
function deriveStatus(order){
  if(!order)return"new";
  if(order.status==="closed")return"paid";
  if(!order.lines||!order.lines.length)return"new";
  const ks=order.lines.map(l=>(l.kitchen_status||"").toLowerCase());
  if(ks.some(s=>["queued","cooking","preparing","new",""].includes(s)))return"kitchen";
  return"served";
}
function orderGross(o){return o&&o.lines?o.lines.filter(l=>!l.combo_parent_id).reduce((a,l)=>a+Number(l.line_total),0):0}

/* ── boot ── */
async function boot(){
  if(!storeId){$("dineGrid").innerHTML='<div style="grid-column:1/-1;color:var(--ink3);padding:40px 0">請在網址加上 ?store=&lt;門市UUID&gt;</div>';return}
  try{
    const [items,cats]=await Promise.all([
      api(`/menu/items?store_id=${storeId}&available_only=true`),
      api(`/menu/categories?store_id=${storeId}`).catch(()=>[])]);
    S.menu=items;S.cats={};cats.forEach(c=>S.cats[c.id]=c.name);
  }catch(e){toast("載入菜單失敗: "+e.message)}
  go("floor");
}

/* ── floor ── */
async function loadFloor(){
  let floor=[];try{floor=await api(`/tables/floor?store_id=${storeId}`)}catch(e){$("dineGrid").innerHTML=`<div style="grid-column:1/-1;color:var(--ink3);padding:30px 0">載入桌況失敗: ${e.message}</div>`;return}
  S.floor=floor;
  // fetch orders for occupied tables (parallel)
  const occ=floor.filter(t=>t.is_occupied&&t.session);
  await Promise.all(occ.map(async t=>{try{S.orders[t.session.id]=await api(`/tables/sessions/${t.session.id}/order`)}catch(e){}}));
  renderFloor();
}
function elapsed(iso){if(!iso)return 0;return Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000))}
function renderFloor(){
  const dine=S.floor.filter(t=>(t.zone||"")!=="外帶"&&(t.zone||"")!=="候位");
  const to=S.floor.filter(t=>(t.zone||"")==="外帶"||(t.zone||"")==="候位");
  $("dineCnt").textContent=dine.filter(t=>t.is_occupied).length+" / "+dine.length+" 使用中";
  $("toCnt").textContent=to.filter(t=>t.is_occupied).length+" 進行中";
  const card=t=>{
    const o=t.session?S.orders[t.session.id]:null;
    const st=t.is_occupied?deriveStatus(o):"empty";
    const cls=st==="empty"?"empty":st;
    const amt=orderGross(o);
    return `<div class="tcard ${cls}" tabindex="0" onclick="openTable('${t.id}')">
      <div class="strip"></div>
      ${st!=="empty"?`<div class="pill">${ST_LABEL[st]}</div>`:""}
      <div class="nm">${t.name}</div>
      ${st==="empty"?`<div class="meta"></div><div class="amt">點我開桌 ›</div>`:
        `<div class="meta"><span><b>${t.session?t.session.party_size:t.seats}</b> 位</span><span>⏱ <b>${t.session?elapsed(t.session.opened_at):0}</b> 分</span></div>
         <div class="amt num">${NT(amt)}</div>`}
    </div>`};
  $("dineGrid").innerHTML=dine.length?dine.map(card).join(""):'<div style="grid-column:1/-1;color:var(--ink3);padding:20px 0">這間門市還沒建立桌位</div>';
  $("toGrid").innerHTML=to.map(card).join("");
}

/* ── order ── */
let curCat="__all__";
async function openTable(tableId){
  const t=S.floor.find(x=>x.id===tableId);if(!t)return;
  let sessId=t.session?t.session.id:null;
  if(!t.is_occupied){
    try{const s=await api(`/tables/${tableId}/open`,{method:"POST",body:JSON.stringify({party_size:t.seats||2})});sessId=s.id;toast(t.name+" 已開桌")}
    catch(e){toast("開桌失敗: "+e.message);return}
  }
  S.cur={tableId,sessId,name:t.name};
  $("billTitle").textContent=t.name;curCat="__all__";
  go("order");$("orderWrap").classList.remove("showmenu");
  await refreshBill();renderMenu();
}
function backToFloor(){go("floor")}
async function refreshBill(){
  let order,quote;
  // 序列不平行: order 與 quote 都是 get-or-create, 平行打首次觸碰會
  // 各建一張 OPEN 單 (DB 唯一索引已擋, 但前端也不該自己製造 race)
  try{order=await api(`/tables/sessions/${S.cur.sessId}/order`);
    quote=await api(`/tables/sessions/${S.cur.sessId}/quote`);}
  catch(e){$("billLines").innerHTML=`<div class="empty-bill">載入失敗: ${e.message}</div>`;return}
  S.cur.order=order;S.cur.quote=quote;S.orders[S.cur.sessId]=order;
  $("billNo").textContent=order.order_no||"—";
  const lines=order.lines.filter(l=>!l.combo_parent_id);
  $("billLines").innerHTML=lines.length?lines.map(l=>{
    const it=S.menu.find(m=>m.id===l.menu_item_id);const nm=it?it.name:(l.menu_item_id||"").slice(0,6);
    const mods=(l.modifiers||[]).map(m=>m.option_name||m.name).filter(Boolean).join("、");
    const note=[mods,l.notes].filter(Boolean).join(" · ");
    return `<div class="line"><div class="q num">${Number(l.qty)}</div><div class="body"><div class="nm">${nm}</div>${note?`<div class="mod">${note}</div>`:""}</div>
      <div class="price num">${NT(l.line_total)}</div><button class="rm" onclick="voidLine('${l.id}')" title="退菜">✕</button></div>`}).join("")
    :`<div class="empty-bill">尚未點餐<br>從右側菜單點選品項加入帳單</div>`;
  const q=quote;let foot=`<div class="foot-row"><span>小計</span><span class="num">${NT(q.gross)}</span></div>`;
  if(Number(q.discount_total)>0)foot+=`<div class="foot-row promo"><span>🏷️ ${q.auto_discount||"折扣"}</span><span class="num">−${NT(q.discount_total)}</span></div>`;
  if(Number(q.service_charge)>0)foot+=`<div class="foot-row"><span>服務費</span><span class="num">${NT(q.service_charge)}</span></div>`;
  foot+=`<div class="foot-total"><span class="lb">應收</span><span class="v num">${NT(q.net)}</span></div>
    <div class="foot-act">
      <button class="btn btn-ghost btn-lg" ${lines.length?"":"disabled"} onclick="refreshBill()">重新整理</button>
      <button class="btn btn-primary btn-lg" ${lines.length?"":"disabled"} onclick="openCheckout()">結帳</button>
    </div>
    <div style="text-align:center;color:var(--ink3);font-size:11.5px;margin-top:9px">品項一經加入即送廚房出單（KDS 同步）</div>`;
  $("billFoot").innerHTML=foot;$("orderWrap").classList.add("showmenu");
}
function menuCats(){const ids=[...new Set(S.menu.map(m=>m.category_id))];
  return[["__all__","全部"],...ids.map(id=>[id||"__none__",S.cats[id]||"其他"])];}
function renderMenu(){
  const cats=menuCats();
  $("cats").innerHTML=cats.map(c=>`<button class="cat ${c[0]===curCat?'on':''}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join("");
  let items=S.menu;
  if(curCat!=="__all__")items=S.menu.filter(m=>(m.category_id||"__none__")===curCat);
  const counts={};(S.cur.order?S.cur.order.lines:[]).forEach(l=>counts[l.menu_item_id]=(counts[l.menu_item_id]||0)+Number(l.qty));
  $("menuGrid").innerHTML=items.length?items.map(m=>{const q=counts[m.id]||0;
    return `<div class="mtile" tabindex="0" onclick="addItem('${m.id}')">
      ${q?`<div class="badge num">${q}</div>`:""}
      <div class="emo">${emo(m.name)}</div><div class="nm">${m.name}</div><div class="pr num">${NT(m.price)}</div></div>`}).join("")
    :'<div style="grid-column:1/-1;color:var(--ink3);padding:30px 0">此分類暫無品項</div>';
}
function setCat(c){curCat=c;renderMenu()}
async function addItem(itemId){
  try{await api(`/tables/sessions/${S.cur.sessId}/lines`,{method:"POST",body:JSON.stringify({menu_item_id:itemId,qty:"1"})});
    await refreshBill();renderMenu();}
  catch(e){toast(e.message)}
}
async function voidLine(lineId){
  if(!confirm("確定退菜？"))return;
  try{await api(`/order-lines/${lineId}/void`,{method:"POST",body:JSON.stringify({})});await refreshBill();renderMenu();toast("已退菜")}
  catch(e){toast("退菜失敗: "+e.message)}
}

/* ── checkout ── */
let coTender="",coPay="現金";
function openCheckout(){const net=Number(S.cur.quote.remaining||S.cur.quote.net);coTender="";coPay="現金";
  const quicks=cashQuicks(net);
  $("ovSheet").innerHTML=`<div class="sheet-h"><h3>結帳 · ${S.cur.name}</h3><button class="x" onclick="closeOv()">✕</button></div>
  <div class="co-body">
    <div class="co-due"><span class="lb">應收金額</span><span class="v num">${NT(net)}</span></div>
    <div class="co-disp"><div class="lb">實收現金</div><div class="tender num" id="coT">$0</div><div class="change num" id="coC"></div></div>
    <div class="quick">${quicks.map(q=>`<button class="${q.exact?'exact':''}" onclick="setTender(${q.v})">${q.label}</button>`).join("")}</div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="padPush('${n}')">${n}</button>`).join("")}
      <button onclick="padPush('00')">00</button><button onclick="padPush('0')">0</button><button onclick="padDel()">⌫</button>
    </div>
    <div class="co-pay">${["現金","信用卡","LINE Pay","街口"].map(p=>`<button class="pay-m ${p==='現金'?'on':''}" data-p="${p}" onclick="setPay('${p}')">${p}</button>`).join("")}</div>
  </div>
  <div class="co-foot"><button class="btn btn-ghost btn-lg" onclick="closeOv()">取消</button>
    <button class="btn btn-primary btn-lg" id="coGo" onclick="doPay()">確認收款 ›</button></div>`;
  $("ov").classList.add("on");updateCo();
}
function cashQuicks(net){const out=[{v:net,label:NT(net),exact:true}];
  [100,500,1000].forEach(d=>{if(d>=net&&!out.find(o=>o.v===d))out.push({v:d,label:NT(d)})});
  const nH=Math.ceil(net/100)*100;if(nH!==net&&!out.find(o=>o.v===nH))out.splice(1,0,{v:nH,label:NT(nH)});
  return out.slice(0,4);}
function setTender(v){coTender=String(v);updateCo()}
function padPush(d){if(coTender.length<7)coTender+=d;updateCo()}
function padDel(){coTender=coTender.slice(0,-1);updateCo()}
function setPay(p){coPay=p;document.querySelectorAll(".pay-m").forEach(b=>b.classList.toggle("on",b.dataset.p===p));updateCo()}
function updateCo(){const net=Number(S.cur.quote.remaining||S.cur.quote.net);const paid=Number(coTender||0);
  $("coT").textContent=NT(paid);const c=$("coC");
  if(coPay==="現金"&&paid>=net&&paid>0)c.textContent="找零 "+NT(paid-net);else c.textContent="";}
async function doPay(){const net=Number(S.cur.quote.remaining||S.cur.quote.net);const paid=Number(coTender||net);
  if(coPay==="現金"&&paid<net){toast("實收不足，應收 "+NT(net));return}
  const tender=coPay==="現金"?String(paid):String(net);
  try{const res=await api(`/tables/sessions/${S.cur.sessId}/checkout`,{method:"POST",body:JSON.stringify({tendered:tender})});
    closeOv();toast(S.cur.name+" 結帳完成"+(res.change&&Number(res.change)>0?" · 找零 "+NT(res.change):" · "+coPay));
    delete S.orders[S.cur.sessId];go("floor");}
  catch(e){toast("結帳失敗: "+e.message)}
}
function closeOv(){$("ov").classList.remove("on")}
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeOv()});

/* ── KDS ── */
async function loadKDS(){
  let lines=[];try{lines=await api(`/kitchen/queue?store_id=${storeId}`)}catch(e){$("kdsWrap").innerHTML=`<div style="grid-column:1/-1;color:var(--ink3);padding:40px 0">載入失敗: ${e.message}</div>`;return}
  // group by order
  const byOrder={};lines.forEach(l=>{const k=l.order_no||l.order_id||"—";(byOrder[k]=byOrder[k]||[]).push(l)});
  const keys=Object.keys(byOrder);
  $("kdsWrap").innerHTML=keys.length?keys.map(k=>{const ls=byOrder[k];
    return `<div class="ticket"><div class="tk-h"><span class="t">${ls[0].table_name||k}</span><span class="clk num">${ls[0].station||""}</span></div>
     <div class="tk-body">${ls.map(l=>`<div class="tk-item"><span><span class="q num">${Number(l.qty)}×</span> ${l.item_name||l.menu_item_id||""}${l.notes?` · ${l.notes}`:""}</span></div>`).join("")}</div>
     <div class="tk-foot"><button class="tk-done" onclick="kdsDone('${ls.map(l=>l.line_id||l.id).join(",")}')">✓ 完成出餐</button></div></div>`}).join("")
    :`<div style="grid-column:1/-1;text-align:center;color:var(--ink3);padding:80px 0;font-size:15px">目前沒有待製作的訂單</div>`;
}
async function kdsDone(ids){
  for(const id of ids.split(",")){try{await api(`/kitchen/lines/${id}/status`,{method:"PATCH",body:JSON.stringify({status:"served"})})}catch(e){}}
  toast("已完成出餐");loadKDS();
}

/* ── reports ── */
// 營業日以台北時區為準 (後端 business_date 同樣用 Asia/Taipei) —
// 不能用 toISOString() (UTC): 台灣凌晨 0-8 點會查到前一天而顯示 $0
function today(){return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"})}
async function loadRep(){
  let sales;try{sales=await api(`/reports/sales?store_id=${storeId}&date_from=${today()}`)}
  catch(e){$("repWrap").innerHTML=`<div style="color:var(--ink3);padding:40px 0">載入報表失敗: ${e.message}</div>`;return}
  let top=[];try{top=await api(`/reports/top-items?store_id=${storeId}&date_from=${today()}&limit=6`)}catch(e){}
  let hourly=null;try{hourly=await api(`/reports/hourly?store_id=${storeId}&date_from=${today()}`)}catch(e){}
  const net=Number(sales.net_sales),cnt=sales.order_count,avg=cnt?net/cnt:0;
  const maxT=top.length?Math.max(...top.map(t=>Number(t.revenue))):1;
  const hrs=hourly?hourly.slices.filter(s=>s.hour>=10&&s.hour<=23):[];
  const maxH=hrs.length?Math.max(...hrs.map(h=>Number(h.net_sales)),1):1;
  $("repWrap").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="lb">今日淨營收</div><div class="v num">${NT(net)}</div><div class="d eq">即時</div></div>
      <div class="kpi"><div class="lb">結帳單數</div><div class="v num">${cnt}</div><div class="d eq">今日</div></div>
      <div class="kpi"><div class="lb">客單價</div><div class="v num">${NT(avg)}</div><div class="d eq">平均</div></div>
      <div class="kpi"><div class="lb">折扣讓利</div><div class="v num">${NT(sales.discount_total)}</div><div class="d eq">今日</div></div>
    </div>
    <div class="rep-card"><h3>熱銷排行</h3>
      ${top.length?top.map(r=>`<div class="bar-row"><span class="nm">${r.name||"—"}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(Number(r.revenue)/maxT*100)}%"></div></div><span class="val num">${Number(r.qty)}份 · ${NT(r.revenue)}</span></div>`).join(""):'<div style="color:var(--ink3)">今日尚無銷售</div>'}
    </div>
    ${hrs.length?`<div class="rep-card"><h3>時段分析</h3>
      <div class="hours">${hrs.map(h=>`<div class="hbar ${Number(h.net_sales)===maxH&&maxH>0?'peak':''}" style="height:${Math.round(Number(h.net_sales)/maxH*100)||2}%"><span>${h.hour}</span></div>`).join("")}</div>
      <div style="height:20px"></div></div>`:""}`;
}

/* clock */
function tick(){const d=new Date();$("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
tick();setInterval(tick,10000);
boot();

</script>

</body>
</html>
