<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>掃碼點餐</title>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --ink: #1f2328; --sub: #6b7280;
    --accent: #c2410c; --accent-ink: #ffffff; --ok: #15803d; --line: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
         background: var(--bg); color: var(--ink); padding-bottom: 88px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card);
           padding: 14px 16px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 18px; }
  header .sub { color: var(--sub); font-size: 13px; }
  main { padding: 12px 14px; max-width: 560px; margin: 0 auto; }
  .notice { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
            border-radius: 12px; padding: 14px; margin: 10px 0; font-size: 15px; }
  .section-title { font-weight: 700; margin: 16px 2px 8px; font-size: 15px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; font-size: 16px; }
  .item .desc { color: var(--sub); font-size: 13px; margin-top: 2px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .price { color: var(--accent); font-weight: 700; margin-top: 2px; }
  .qtyctl { display: flex; align-items: center; gap: 8px; }
  .qtyctl button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
                   background: var(--card); font-size: 20px; line-height: 1; color: var(--accent); }
  .qtyctl button:active { background: #fff3ec; }
  .qtyctl .n { min-width: 20px; text-align: center; font-weight: 700; font-size: 16px; }
  .billline { display: flex; justify-content: space-between; padding: 8px 2px;
              border-bottom: 1px dashed var(--line); font-size: 15px; }
  .total { display: flex; justify-content: space-between; font-weight: 800;
           font-size: 17px; padding: 10px 2px; }
  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
             background: var(--card); border-top: 1px solid var(--line);
             padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
             display: flex; align-items: center; gap: 12px; }
  .cartbar .sum { flex: 1; font-weight: 700; }
  .cartbar button { background: var(--accent); color: var(--accent-ink); border: 0;
                    border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 700; }
  .cartbar button:disabled { opacity: .45; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
           background: #1f2328; color: #fff; padding: 10px 18px; border-radius: 999px;
           font-size: 14px; opacity: 0; transition: opacity .25s; z-index: 20; pointer-events: none; }
  .toast.show { opacity: .96; }
  .toast.err { background: #b91c1c; }
  .empty { color: var(--sub); text-align: center; padding: 28px 0; }
</style>
</head>
<body>
<header>
  <h1 id="tname">掃碼點餐</h1>
  <span class="sub" id="tzone"></span>
</header>

<main>
  <div id="notice" class="notice" style="display:none"></div>

  <div class="section-title">已點餐點</div>
  <div id="bill"><div class="empty">尚未點餐</div></div>

  <div class="section-title">菜單</div>
  <div id="menu"><div class="empty">載入中…</div></div>
</main>

<div class="cartbar">
  <span class="sum" id="cartSum">尚未選擇餐點</span>
  <button id="submitBtn" disabled>送出點餐</button>
</div>

<div class="toast" id="toast"></div>

<script>
// The QR on the table card encodes /order/?t=<qr_token>. The token IS the
// credential — everything below is scoped by the server to this one table.
const API = "";
const token = new URLSearchParams(location.search).get("t");
let ctx = null;           // TableContext from the server
const cart = new Map();   // menu_item_id -> qty

const $ = (id) => document.getElementById(id);
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(() => (t.className = "toast"), 2400);
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function api(path, opts) {
  const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.error?.message || detail; } catch (e) { /* ignore */ }
    throw new Error(detail);
  }
  return res.json();
}

function renderMenu() {
  const el = $("menu");
  if (!ctx.menu.length) { el.innerHTML = `<div class="empty">目前沒有可點的品項</div>`; return; }
  el.innerHTML = ctx.menu.map((m) => {
    const q = cart.get(m.id) || 0;
    return `<div class="item">
      <div class="info">
        <div class="name">${escapeHtml(m.name)}</div>
        ${m.description ? `<div class="desc">${escapeHtml(m.description)}</div>` : ""}
        <div class="price">$${Number(m.price).toFixed(0)}</div>
      </div>
      <div class="qtyctl">
        <button onclick="bump('${m.id}',-1)" ${q ? "" : "disabled"}>−</button>
        <span class="n">${q || ""}</span>
        <button onclick="bump('${m.id}',1)" ${ctx.is_open ? "" : "disabled"}>＋</button>
      </div>
    </div>`;
  }).join("");
  renderCartBar();
}

function bump(id, d) {
  const q = (cart.get(id) || 0) + d;
  if (q <= 0) cart.delete(id); else cart.set(id, q);
  renderMenu();
}

function renderCartBar() {
  let count = 0, sum = 0;
  for (const [id, q] of cart) {
    const m = ctx.menu.find((x) => x.id === id);
    if (m) { count += q; sum += q * Number(m.price); }
  }
  $("cartSum").textContent = count ? `${count} 項 · $${sum.toFixed(0)}` : "尚未選擇餐點";
  $("submitBtn").disabled = !count || !ctx.is_open;
}

function renderBill(bill) {
  const el = $("bill");
  if (!bill.lines.length) { el.innerHTML = `<div class="empty">尚未點餐</div>`; return; }
  el.innerHTML = bill.lines.map((l) => `<div class="billline">
      <span>${escapeHtml(l.name || "品項")} × ${Number(l.qty)}</span>
      <span>$${Number(l.line_total).toFixed(0)}</span>
    </div>`).join("")
    + `<div class="total"><span>目前合計</span><span>$${Number(bill.total).toFixed(0)}</span></div>`;
}

async function refreshBill() {
  try { renderBill(await api(`/t/${encodeURIComponent(token)}/bill`)); } catch (e) { /* keep old */ }
}

async function submit() {
  const items = [...cart.entries()].map(([menu_item_id, qty]) => ({ menu_item_id, qty: String(qty) }));
  if (!items.length) return;
  $("submitBtn").disabled = true;
  try {
    const bill = await api(`/t/${encodeURIComponent(token)}/cart`, {
      method: "POST", body: JSON.stringify({ items }),
    });
    cart.clear();
    renderBill(bill);
    renderMenu();
    toast("已送出！餐點已加入本桌帳單");
  } catch (e) { toast(e.message, true); $("submitBtn").disabled = false; }
}

async function boot() {
  if (!token) {
    $("notice").style.display = "block";
    $("notice").textContent = "連結不完整 — 請重新掃描桌上的 QR Code。";
    $("menu").innerHTML = "";
    return;
  }
  try { ctx = await api(`/t/${encodeURIComponent(token)}/context`); }
  catch (e) {
    $("notice").style.display = "block";
    $("notice").textContent = "找不到這張桌子 — 請重新掃描桌上的 QR Code，或請店員協助。";
    $("menu").innerHTML = "";
    return;
  }
  $("tname").textContent = `桌位 ${ctx.table_name}`;
  $("tzone").textContent = ctx.zone || "";
  if (!ctx.is_open) {
    $("notice").style.display = "block";
    $("notice").textContent = "這桌還沒開桌 — 請招呼服務人員為您開桌後即可點餐。";
  }
  renderMenu();
  refreshBill();
  // Light polling keeps the bill in sync when staff also add/void items.
  setInterval(refreshBill, 8000);
}

$("submitBtn").onclick = submit;
boot();
</script>
</body>
</html>
