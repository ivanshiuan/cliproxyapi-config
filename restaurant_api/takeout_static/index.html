<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>線上外帶</title>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --ink: #1f2328; --sub: #6b7280;
    --accent: #c2410c; --accent-ink: #ffffff; --ok: #15803d; --line: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
         background: var(--bg); color: var(--ink); padding-bottom: 88px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card);
           padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; }
  header .sub { color: var(--sub); font-size: 13px; margin-top: 2px; }
  main { padding: 12px 14px; max-width: 560px; margin: 0 auto; }
  .notice { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
            border-radius: 12px; padding: 14px; margin: 10px 0; font-size: 15px; }
  .section-title { font-weight: 700; margin: 16px 2px 8px; font-size: 15px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; font-size: 16px; }
  .item .price { color: var(--accent); font-weight: 700; margin-top: 2px; }
  .qtyctl { display: flex; align-items: center; gap: 8px; }
  .qtyctl button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
                   background: var(--card); font-size: 20px; line-height: 1; color: var(--accent); }
  .qtyctl .n { min-width: 20px; text-align: center; font-weight: 700; font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; }
  .row { margin-bottom: 12px; }
  .row label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--sub); }
  .row input, .row textarea {
    width: 100%; padding: 11px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; }
  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
             background: var(--card); border-top: 1px solid var(--line);
             padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
             display: flex; align-items: center; gap: 12px; }
  .cartbar .sum { flex: 1; font-weight: 700; }
  .cartbar button { background: var(--accent); color: var(--accent-ink); border: 0;
                    border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 700; }
  .cartbar button:disabled { opacity: .45; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
           background: #1f2328; color: #fff; padding: 10px 18px; border-radius: 999px;
           font-size: 14px; opacity: 0; transition: opacity .25s; z-index: 20; pointer-events: none; }
  .toast.show { opacity: .96; }
  .toast.err { background: #b91c1c; }
  .empty { color: var(--sub); text-align: center; padding: 28px 0; }
  .ok { text-align: center; padding: 30px 6px; }
  .ok .big { font-size: 46px; }
  .ok .detail { color: var(--sub); line-height: 1.8; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>🥡 線上外帶</h1>
  <div class="sub">選好餐點、留下聯絡方式，到店直接取餐付款。</div>
</header>

<main>
  <div id="notice" class="notice" style="display:none"></div>

  <div id="orderView">
    <div class="section-title">菜單</div>
    <div id="menu"><div class="empty">載入中…</div></div>

    <div class="section-title">取餐資訊</div>
    <div class="card">
      <div class="row"><label>姓名</label><input id="name" maxlength="80" placeholder="王小明" /></div>
      <div class="row"><label>電話</label><input id="phone" type="tel" maxlength="32" placeholder="09xx-xxx-xxx" /></div>
      <div class="row"><label>取餐時間（可留空 = 盡快）</label><input id="pickup" type="time" step="900" /></div>
      <div class="row"><label>備註（可留空）</label><textarea id="notes" rows="2" maxlength="200"></textarea></div>
    </div>
  </div>

  <div class="card ok" id="done" style="display:none">
    <div class="big">✅</div>
    <h2>已送出外帶單</h2>
    <div class="detail" id="doneDetail"></div>
  </div>
</main>

<div class="cartbar" id="cartbar">
  <span class="sum" id="cartSum">尚未選擇餐點</span>
  <button id="submitBtn" disabled>送出外帶單</button>
</div>

<div class="toast" id="toast"></div>

<script>
// /takeout/?store=<uuid> — no login, no table. Order stays OPEN until staff
// collects cash at pickup (no payment gateway yet).
const API = "";
const storeId = new URLSearchParams(location.search).get("store");
let menu = [];
const cart = new Map(); // menu_item_id -> qty

const $ = (id) => document.getElementById(id);
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(() => (t.className = "toast"), 2600);
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function api(path, opts) {
  const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.error?.message || detail; } catch (e) { /* ignore */ }
    throw new Error(detail);
  }
  return res.json();
}

function renderMenu() {
  const el = $("menu");
  if (!menu.length) { el.innerHTML = `<div class="empty">目前沒有可外帶的品項</div>`; return; }
  el.innerHTML = menu.map((m) => {
    const q = cart.get(m.id) || 0;
    return `<div class="item">
      <div class="info">
        <div class="name">${escapeHtml(m.name)}</div>
        <div class="price">$${Number(m.price).toFixed(0)}</div>
      </div>
      <div class="qtyctl">
        <button onclick="bump('${m.id}',-1)" ${q ? "" : "disabled"}>−</button>
        <span class="n">${q || ""}</span>
        <button onclick="bump('${m.id}',1)">＋</button>
      </div>
    </div>`;
  }).join("");
  renderCartBar();
}

function bump(id, d) {
  const q = (cart.get(id) || 0) + d;
  if (q <= 0) cart.delete(id); else cart.set(id, q);
  renderMenu();
}

function renderCartBar() {
  let count = 0, sum = 0;
  for (const [id, q] of cart) {
    const m = menu.find((x) => x.id === id);
    if (m) { count += q; sum += q * Number(m.price); }
  }
  $("cartSum").textContent = count ? `${count} 項 · $${sum.toFixed(0)}` : "尚未選擇餐點";
  $("submitBtn").disabled = !count;
}

async function submit() {
  const items = [...cart.entries()].map(([menu_item_id, qty]) => ({ menu_item_id, qty: String(qty) }));
  if (!items.length) return;
  const name = $("name").value.trim();
  const phone = $("phone").value.trim();
  if (!name) return toast("請填姓名", true);
  if (!phone) return toast("請填電話，方便到店核對", true);

  let pickup_at = null;
  if ($("pickup").value) {
    const today = new Date().toISOString().slice(0, 10);
    pickup_at = `${today}T${$("pickup").value}:00+08:00`;
  }

  $("submitBtn").disabled = true;
  try {
    const res = await api("/online-takeout", {
      method: "POST",
      body: JSON.stringify({
        store_id: storeId,
        contact_name: name,
        contact_phone: phone,
        items,
        pickup_at,
        notes: $("notes").value.trim() || null,
      }),
    });
    $("orderView").style.display = "none";
    $("cartbar").style.display = "none";
    $("done").style.display = "block";
    $("doneDetail").innerHTML =
      `單號 <b>${res.order.order_no}</b><br>` +
      `預估金額 <b>$${Number(res.estimated_total).toFixed(0)}</b>（現場收款）<br>` +
      (pickup_at ? `取餐時間 <b>${$("pickup").value}</b>` : `盡快為您準備`) +
      `<br>請於取餐時告知單號，謝謝！`;
  } catch (e) { toast(e.message, true); $("submitBtn").disabled = false; }
}

async function boot() {
  if (!storeId) {
    $("notice").style.display = "block";
    $("notice").textContent = "連結不完整 — 請透過店家提供的外帶連結進入。";
    $("orderView").style.display = "none";
    $("cartbar").style.display = "none";
    return;
  }
  try {
    menu = await api(`/menu/items?store_id=${encodeURIComponent(storeId)}&available_only=true&available_now=true`);
  } catch (e) {
    menu = [];
  }
  renderMenu();
}

$("submitBtn").onclick = submit;
boot();
</script>
</body>
</html>
