<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>行銷中心 · 全域餐飲管理系統</title>
<style>
  :root {
    --bg:#16101f; --panel:#1f1730; --panel2:#272036; --line:#382c52;
    --accent:#ffd34e; --accent2:#ff5d8f; --good:#46d39a; --bad:#ff6b6b;
    --text:#f4f0ff; --muted:#9d8fc4;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; position:sticky; top:0; background:var(--bg); z-index:10; }
  header h1 { font-size:18px; margin:0; }
  header .tag { font-size:12px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .card h2 .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font:inherit; }
  input:focus,select:focus{ outline:2px solid var(--accent); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button { font:inherit; font-weight:700; border:0; border-radius:9px; cursor:pointer; padding:9px 14px; color:#1b1033; background:var(--accent); }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.pink { background:var(--accent2); color:#fff; }
  button.sm { padding:5px 9px; font-size:12px; }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .clist { display:flex; flex-direction:column; gap:8px; }
  .citem { padding:10px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--panel2); }
  .citem.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .citem .nm { font-weight:700; }
  .citem .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700; }
  .pill.draft{ background:#3a3357; color:#c9bdf0; }
  .pill.active{ background:#16432f; color:var(--good); }
  .pill.ended{ background:#3a2330; color:#ffa8a8; }
  .pill.redeemed{ background:#16432f; color:var(--good); }
  .pill.expired{ background:#3a2330; color:#ffa8a8; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); font-size:13px; padding:14px 0; text-align:center; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:#000a; border:1px solid var(--line); padding:10px 18px; border-radius:999px;
    font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; }
  .links a { color:var(--accent); font-size:13px; margin-right:14px; }
  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .stat b { display:block; font-size:22px; line-height:1.1; }
  .stat span { color:var(--muted); font-size:11px; }
  .funnel { display:flex; height:10px; border-radius:6px; overflow:hidden; margin:12px 0 6px; background:var(--panel2); }
  .funnel i { display:block; height:100%; }
  .fr { background:var(--good); }       /* redeemed */
  .fa { background:var(--accent); }     /* active */
  .fe { background:#ffa8a8; }           /* expired */
  .legend span { font-size:11px; color:var(--muted); margin-right:12px; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  input.cell { width:74px; padding:5px 7px; margin:0; }
  .big { font-size:22px; font-weight:800; }
  .hint { font-size:11px; color:var(--muted); margin-top:4px; }
  header nav button.active-nav { border-color:var(--accent); color:var(--accent); }
  .lib-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .scard { border:1px solid var(--line); border-radius:14px; padding:16px; background:var(--panel); display:flex; flex-direction:column; }
  .scard .shd { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .scard .shd .ic { font-size:22px; } .scard .shd b { font-size:15px; }
  .scard .body { font-size:13px; line-height:1.75; color:#d7ccef; flex:1; }
  .scard .body b { color:var(--text); }
  .scard .act { margin-top:12px; }
</style>
</head>
<body>
<header>
  <h1>🎯 行銷中心</h1>
  <span class="tag">全域餐飲管理系統 · 行銷模組</span>
  <nav id="nav" style="margin-left:18px;display:none;gap:6px">
    <button id="navLib" class="ghost sm" onclick="showView('lib')">🏠 行銷策略庫</button>
    <button id="navWheel" class="ghost sm" onclick="showView('wheel')">🎡 開幕輪盤</button>
    <button id="navShare" class="ghost sm" onclick="showView('share')">🔗 分享解鎖</button>
    <button id="navPush" class="ghost sm" onclick="showView('push')">📣 精準推播</button>
    <button id="navUgc" class="ghost sm" onclick="showView('ugc')">📸 打卡評論</button>
  </nav>
  <button id="logoutBtn" class="ghost sm" style="margin-left:auto;display:none" onclick="logout()">登出</button>
</header>

<!-- 登入遮罩 -->
<div id="loginOverlay" style="position:fixed;inset:0;background:#0c0814ee;display:none;
     place-items:center;z-index:100">
  <div class="card" style="width:340px;margin:0">
    <h2><span class="dot"></span>店長後台登入</h2>
    <label>通行碼</label>
    <input id="passcode" type="password" placeholder="請輸入店長通行碼"
      onkeydown="if(event.key==='Enter')doLogin()" />
    <div id="loginErr" class="hint" style="color:var(--bad);min-height:16px"></div>
    <div style="margin-top:12px"><button style="width:100%" onclick="doLogin()">登入</button></div>
    <div class="hint" style="margin-top:10px">開發預設密碼 <code>changeme-admin</code>；上線請設 <code>RESTO_ADMIN_PASSCODE</code>。</div>
  </div>
</div>

<div id="app" style="display:none">

  <!-- ══ 🎯 行銷策略庫（首頁：店長一進來看到的整櫃工具）══ -->
  <div id="viewLib" style="max-width:1200px;margin:0 auto;padding:16px"></div>

  <!-- ══ 🎡 開幕輪盤活動管理（策略庫中的第一個「已上線」工具）══ -->
  <div id="viewWheel" class="grid" style="display:none">
  <!-- ── 左欄：活動列表 + 建立 ── -->
  <div>
    <div class="card">
      <h2><span class="dot"></span>活動列表</h2>
      <div class="row" style="margin-bottom:10px">
        <select id="statusFilter">
          <option value="">全部狀態</option>
          <option value="draft">草稿</option>
          <option value="active">進行中</option>
          <option value="ended">已結束</option>
        </select>
        <button class="ghost" onclick="loadCampaigns()">重新整理</button>
      </div>
      <div id="campaignList" class="clist"><div class="empty">載入中…</div></div>
    </div>

    <div class="card">
      <h2><span class="dot"></span>建立新活動</h2>
      <label>活動名稱</label>
      <input id="cName" placeholder="開幕輪盤抽獎" />
      <label>網址代稱 slug（小寫英數與 -）</label>
      <input id="cSlug" placeholder="grand-open-2026" />
      <div class="row">
        <div><label>每日抽獎次數</label><input id="cLimit" type="number" value="1" min="1" max="100" /></div>
        <div><label>券有效天數</label><input id="cValid" type="number" value="14" min="1" max="365" /></div>
      </div>
      <div class="row">
        <div><label>開始時間（選填）</label><input id="cStarts" type="datetime-local" /></div>
        <div><label>結束時間（選填）</label><input id="cEnds" type="datetime-local" /></div>
      </div>
      <label>每日推播訊息（選填）</label>
      <input id="cMsg" placeholder="今天也來抽一波！" />
      <div class="hint">時間以台北時間計；活動需「進行中」且在時間區間內才可抽獎。</div>
      <div style="margin-top:12px"><button onclick="createCampaign()">＋ 建立活動</button></div>
    </div>
  </div>

  <!-- ── 右欄：選定活動的詳情 ── -->
  <div>
    <div id="detail" class="card"><div class="empty">← 從左側選一個活動，或先建立一個</div></div>
  </div>
  </div><!-- /viewWheel -->

  <!-- ══ 🔗 分享解鎖（送券裂變）：配額券包管理 ══ -->
  <div id="viewShare" style="max-width:1200px;margin:0 auto;padding:16px;display:none"></div>

  <!-- ══ 📣 精準分眾推播：RFM 分眾 + LINE 推播 ══ -->
  <div id="viewPush" style="max-width:1200px;margin:0 auto;padding:16px;display:none"></div>

  <!-- ══ 📸 打卡／評論換獎：UGC 審核佇列 ══ -->
  <div id="viewUgc" style="max-width:1200px;margin:0 auto;padding:16px;display:none"></div>
</div><!-- /app -->

<div id="toast" class="toast"></div>

<script>
const API = location.origin;            // same-origin
let CAMPAIGNS = [];
let CUR = null;                          // selected campaign object

const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function money(v){ return "NT$"+Number(v).toLocaleString("zh-TW",{maximumFractionDigits:0}); }
// Taipei is a fixed +08:00 offset (no DST) — keep tz handling trivial.
function tpeToIso(localVal){ if(!localVal) return null; const v=localVal.length===16?localVal+":00":localVal; return v+"+08:00"; }
function isoToTpeInput(iso){ if(!iso) return ""; return new Date(new Date(iso).getTime()+8*3600*1000).toISOString().slice(0,16); }
function fmtTpe(iso){ return iso?isoToTpeInput(iso).replace("T"," ")+"（台北）":"未設定"; }

async function api(path, opts={}){
  const res = await fetch(API+path, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  const body = await res.text();
  let data; try{ data = body ? JSON.parse(body) : null; }catch{ data = body; }
  if(!res.ok){
    if(res.status===401 && !path.startsWith("/admin/")){ showLogin(); }  // session expired mid-use
    const msg = (data && (data.detail?.message || data.detail || data.message)) || ("HTTP "+res.status);
    const err = new Error(typeof msg==="string"?msg:JSON.stringify(msg)); err.status = res.status; throw err;
  }
  return data;
}

// ── 登入閘門 ──
function showLogin(){ $("loginOverlay").style.display="grid"; $("app").style.display="none"; $("nav").style.display="none"; $("logoutBtn").style.display="none"; $("passcode").focus(); }
function showApp(){ $("loginOverlay").style.display="none"; $("app").style.display="block"; $("nav").style.display="flex"; $("logoutBtn").style.display="inline-block"; }
// 切換行銷中心的分頁：'lib' = 策略庫首頁，'wheel' = 開幕輪盤工具
function showView(v){
  $("viewLib").style.display   = v==='lib'   ? 'block' : 'none';
  $("viewWheel").style.display = v==='wheel' ? 'grid'  : 'none';
  $("viewShare").style.display = v==='share' ? 'block' : 'none';
  $("viewPush").style.display  = v==='push'  ? 'block' : 'none';
  $("viewUgc").style.display   = v==='ugc'   ? 'block' : 'none';
  $("navLib").classList.toggle('active-nav', v==='lib');
  $("navWheel").classList.toggle('active-nav', v==='wheel');
  $("navShare").classList.toggle('active-nav', v==='share');
  $("navPush").classList.toggle('active-nav', v==='push');
  $("navUgc").classList.toggle('active-nav', v==='ugc');
  if(v==='lib') renderStrategyLibrary();
  if(v==='share') renderShare();
  if(v==='push') renderPush();
  if(v==='ugc') renderUgc();
}
async function enter(){ showApp(); await loadCampaigns(); showView('lib'); }
async function boot(){
  try{ await api("/admin/session"); await enter(); }
  catch{ showLogin(); }
}
async function doLogin(){
  const pc=$("passcode").value;
  $("loginErr").textContent="";
  try{
    const res=await fetch(API+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({passcode:pc})});
    if(!res.ok){ $("loginErr").textContent="通行碼錯誤"; return; }
    $("passcode").value=""; await enter();
  }catch(e){ $("loginErr").textContent="登入失敗："+e.message; }
}

// ── 🎯 行銷策略庫：店長挑策略 → 填參數 → 啟用，不用再找工程師（設計見 docs/19）──
const STRATEGIES = [
  { icon:"🎡", name:"開幕輪盤抽獎", live:true,
    goal:"門口 QR 引流、天天回訪、每個玩家變 LINE 會員",
    how:"掃碼→加好友→免打字進輪盤→每日一抽→中獎領券→到店核銷",
    win:"曝光變會員、每日活躍、到店轉換",
    cta:"進入管理 →", act:"showView('wheel')" },
  { icon:"🔗", name:"分享解鎖（裂變送券）", live:true,
    goal:"舊客帶新客，零廣告費長會員",
    how:"送一張券（例：肉盤），要領到必須分享給「非會員」朋友→朋友加好友+註冊→兩人都能用券來店消費",
    win:"每發一張券≈長一個新會員，病毒式擴散",
    cta:"進入管理 →", act:"showView('share')" },
  { icon:"🎂", name:"生日禮",
    goal:"生日把客人拉回店、加深情感黏著",
    how:"會員生日當週自動推播一張生日券（免費甜點／肉盤折扣）",
    win:"高回應率的自然回訪由頭" },
  { icon:"🎯", name:"每日任務（回訪連續度）",
    goal:"讓客人天天上來、養成習慣",
    how:"連續回訪／抽獎 N 天→解鎖加碼獎；斷了重來",
    win:"每日活躍、拉長生命週期" },
  { icon:"📣", name:"精準分眾推播（Retarget）", live:true,
    goal:"對的人對的時間推，不每天洗版",
    how:"依 RFM 六分眾各推不同訊息：流失客召回、主力客升級",
    win:"高精準、低反感、召回沉睡客",
    cta:"進入管理 →", act:"showView('push')" },
  { icon:"💰", name:"儲值加贈",
    goal:"一次鎖住未來多次消費",
    how:"儲 500 送 10%、1000 送 20%（級距加贈）",
    win:"提前回收現金、綁定回流" },
  { icon:"📸", name:"打卡／評論換獎（UGC）", live:true,
    goal:"用點數買口碑（Google 五星／IG 曝光）",
    how:"客人評論／打卡→店員審核→發點",
    win:"自然流量＋社群曝光",
    cta:"進入審核 →", act:"showView('ugc')" },
  { icon:"🧾", name:"券 QR ＋ POS 掃碼核銷",
    goal:"櫃檯掃一下就消帳、量化行銷 ROI",
    how:"中獎券顯示成 QR→店員／POS 掃→核銷→計入客流",
    win:"核銷零錯誤、到店人數可統計" },
];
function renderStrategyLibrary(){
  const live = STRATEGIES.filter(s=>s.live).length;
  const cards = STRATEGIES.map(s=>`
    <div class="scard">
      <div class="shd">
        <span class="ic">${s.icon}</span><b>${esc(s.name)}</b>
        <span class="pill ${s.live?'active':'draft'}" style="margin-left:auto">${s.live?'已上線':'即將開放'}</span>
      </div>
      <div class="body">
        <div>🎯 <b>目標</b>：${esc(s.goal)}</div>
        <div>🛠️ <b>做法</b>：${esc(s.how)}</div>
        <div>📈 <b>效果</b>：${esc(s.win)}</div>
      </div>
      <div class="act">
        ${s.live
          ? `<button class="sm" onclick="${s.act}">${esc(s.cta||'進入管理 →')}</button>`
          : `<button class="ghost sm" disabled>即將開放 · 跟開發者說「先做這個」</button>`}
      </div>
    </div>`).join("");
  $("viewLib").innerHTML = `
    <div style="margin-bottom:14px">
      <h2 style="font-size:20px;margin:0 0 4px">🎯 行銷策略庫</h2>
      <div class="muted">挑一個策略、填參數即可啟用，店長不用再找工程師開發。
        目前 <b style="color:var(--good)">${live} 個已上線</b> · 其餘引擎多已就緒，逐步接進後台。</div>
    </div>
    <div class="lib-grid">${cards}</div>`;
}

// ── 🔗 分享解鎖 · 送券裂變（配額券包，走既有 /vouchers/grants）──
function renderShare(){
  $("viewShare").innerHTML = `
  <div class="card">
    <h2><span class="dot"></span>🔗 分享解鎖 · 送券裂變</h2>
    <div class="muted" style="line-height:1.75">
      <b style="color:var(--text)">怎麼運作</b>：發一批「配額券包」給貴人／老客（例：送 100 張肉盤券），
      他們把券分享出去；朋友加好友＋註冊後雙方都能到店用券——每一張＝一次新客觸及。<br>
      <b style="color:var(--text)">這裡可操作</b>：建立配額券包、逐張發出、看每個人發了幾張還剩多少（硬上限，發完就停）。
      顧客端「一鍵分享解鎖」按鈕（LINE 分享給非會員朋友）為下一步，接進顧客頁。
    </div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>建立配額券包</h2>
    <div class="row">
      <div style="flex:2"><label>來源／貴人名稱</label><input id="gName" placeholder="王老闆 / 開幕檔" /></div>
      <div><label>券種標籤</label><input id="gKind" placeholder="肉盤券" /></div>
    </div>
    <div class="row">
      <div><label>份數（配額上限）</label><input id="gQuota" type="number" min="1" value="100" /></div>
      <div><label>面額(元)</label><input id="gFace" type="number" min="0" value="0" /></div>
      <div><label>有效到（含當日）</label><input id="gUntil" type="date" /></div>
    </div>
    <div style="margin-top:12px"><button class="pink" onclick="createGrant()">＋ 建立券包</button></div>
    <div class="hint">份數是硬上限（發完就沒了）；面額用整數元。</div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>配額券包儀表
      <span style="float:right"><button class="ghost sm" onclick="loadGrants()">↻ 重新整理</button></span></h2>
    <div id="grantTable"><div class="empty">載入中…</div></div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>櫃台核銷送券（朋友來店出示見面禮碼 → 送券人得回饋）</h2>
    <div class="row">
      <div style="flex:2"><label>見面禮核銷碼</label><input id="giftCode" placeholder="貼上朋友出示的碼" onkeydown="if(event.key==='Enter')redeemGift()" /></div>
      <div style="align-self:flex-end"><button onclick="redeemGift()">核銷</button></div>
    </div>
    <div id="giftRedeemBox" style="margin-top:10px"></div>
    <div class="hint">核銷後才發回饋給送券人（防農場）；每人每月回饋有上限。</div>
  </div>`;
  loadGrants();
}
async function redeemGift(){
  const id=$("giftCode").value.trim();

async function loadSegments(){
  const box=$("segTable"); if(!box) return;
  let data; try{ data=await api("/membership/segments"); }
  catch(e){ box.innerHTML=`<div class="empty">讀取失敗：${esc(e.message)}</div>`; return; }
  const counts={}; (data.segments||[]).forEach(b=>counts[b.segment]=b.count);
  const total=$("segTotal"); if(total) total.textContent=`（已評分 ${data.total_scored} 人）`;
  box.innerHTML=`<table>
    <tr><th>分眾</th><th>人數</th><th></th></tr>
    ${SEG_ORDER.map(s=>`<tr>
      <td>${SEG_LABEL[s]}</td>
      <td>${counts[s]||0}</td>
      <td style="text-align:right"><button class="ghost sm" onclick="document.getElementById('segSel').value='${s}';document.getElementById('pushMsg').focus()">選此群 →</button></td>
    </tr>`).join("")}
  </table>`;
  const sel=$("segSel"); if(sel) sel.innerHTML=SEG_ORDER.map(s=>`<option value="${s}">${SEG_LABEL[s]}（${counts[s]||0} 人）</option>`).join("");
}
async function sendBroadcast(){
  const segment=$("segSel").value, message=$("pushMsg").value.trim();
  if(!message){ toast("請輸入訊息內容"); return; }
  const box=$("pushResult");
  try{
    const r=await api(`/membership/segments/${segment}/broadcast`,{method:"POST",body:JSON.stringify({message})});
    box.innerHTML=`<div style="border:1px solid var(--good);border-radius:12px;padding:12px">
      ✅ 已送達 <b>${r.delivered}</b> / ${r.audience_size} 人（${SEG_LABEL[r.segment]||r.segment}）</div>`;
    $("pushMsg").value="";
  }catch(e){ box.innerHTML=`<div class="empty">發送失敗：${esc(e.message)}</div>`; }
}

async function loadGrants(){

async function createGrant(){
  const grantee_name=$("gName").value.trim(), voucher_kind=$("gKind").value.trim();
  if(!grantee_name||!voucher_kind){ toast("請填來源名稱與券種"); return; }
  if(!$("gUntil").value){ toast("請選有效到日期"); return; }
  const body={
    grantee_name, voucher_kind,
    total_quota:Number($("gQuota").value)||1,
    face_value:String($("gFace").value||"0"),
    valid_until:$("gUntil").value,
  };
  try{ await api("/vouchers/grants",{method:"POST",body:JSON.stringify(body)});
    toast("配額券包已建立"); $("gName").value=$("gKind").value=""; loadGrants();
  }catch(e){ toast("建立失敗："+e.message); }
}
async function distributeGrant(id){
  try{ await api(`/vouchers/grants/${id}/distribute`,{method:"POST",body:"{}"});
    toast("已發出一張 🎟"); loadGrants();
  }catch(e){ toast("發券失敗："+e.message); }
}

async function loadCampaigns(){
  const f = $("statusFilter").value;
  try{
    CAMPAIGNS = await api("/campaigns"+(f?`?campaign_status=${f}`:""));
    renderCampaignList();
  }catch(e){ $("campaignList").innerHTML=`<div class="empty">讀取失敗：${esc(e.message)}</div>`; }
}
function renderCampaignList(){
  const el = $("campaignList");
  if(!CAMPAIGNS.length){ el.innerHTML=`<div class="empty">尚無活動，請於下方建立</div>`; return; }
  el.innerHTML = CAMPAIGNS.map(c=>`
    <div class="citem ${CUR&&CUR.id===c.id?'active':''}" onclick="selectCampaign('${c.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="nm">${esc(c.name)}</span>
        <span class="pill ${c.status}">${statusLabel(c.status)}</span>
      </div>
      <div class="meta">每日 ${c.daily_spin_limit} 抽 · 券效 ${c.voucher_validity_days} 天 · /${esc(c.slug)}</div>
    </div>`).join("");
}
function statusLabel(s){ return {draft:"草稿",active:"進行中",ended:"已結束"}[s]||s; }

async function createCampaign(){
  const name=$("cName").value.trim(), slug=$("cSlug").value.trim();
  if(!name||!slug){ toast("請填活動名稱與 slug"); return; }
  if(!/^[a-z0-9][a-z0-9-]*$/.test(slug)){ toast("slug 只能小寫英數與 -"); return; }
  try{
    const c = await api("/campaigns",{method:"POST",body:JSON.stringify({
      name, slug,
      daily_spin_limit:Number($("cLimit").value)||1,
      voucher_validity_days:Number($("cValid").value)||14,
      starts_at:tpeToIso($("cStarts").value),
      ends_at:tpeToIso($("cEnds").value),
      daily_message:$("cMsg").value.trim()||null,
    })});
    toast("活動已建立（草稿）");
    $("cName").value=$("cSlug").value=$("cMsg").value=$("cStarts").value=$("cEnds").value="";
    await loadCampaigns(); selectCampaign(c.id);
  }catch(e){ toast("建立失敗："+e.message); }
}

async function loadStats(){
  const box=$("statsBox"); if(!box||!CUR) return;
  let s; try{ s=await api(`/campaigns/${CUR.id}/stats`); }
  catch(e){ box.innerHTML=`<div class="empty">讀取失敗：${esc(e.message)}</div>`; return; }
  const pct=v=>(v*100).toFixed(v?1:0)+"%";
  const minted=s.vouchers_minted||1;  // avoid /0 for bar widths
  const w=n=>(n/minted*100).toFixed(2)+"%";
  box.innerHTML=`
    <div class="stats-grid">
      <div class="stat"><b>${s.total_spins}</b><span>總抽獎次數</span></div>
      <div class="stat"><b>${s.unique_players}</b><span>參與人數</span></div>
      <div class="stat"><b>${pct(s.win_rate)}</b><span>中獎率</span></div>
      <div class="stat"><b>${pct(s.redemption_rate)}</b><span>核銷率</span></div>
      <div class="stat"><b>${money(s.value_redeemed)}</b><span>已核銷獎品價值</span></div>
      <div class="stat"><b>${money(s.value_outstanding)}</b><span>未核銷負債（流通中）</span></div>
    </div>
    <div class="funnel" title="券漏斗：已發 ${s.vouchers_minted} 張">
      <i class="fr" style="width:${w(s.vouchers_redeemed)}"></i>
      <i class="fa" style="width:${w(s.vouchers_active)}"></i>
      <i class="fe" style="width:${w(s.vouchers_expired)}"></i>
    </div>
    <div class="legend">
      <span><i class="fr"></i>已核銷 ${s.vouchers_redeemed}</span>
      <span><i class="fa"></i>可用 ${s.vouchers_active}</span>
      <span><i class="fe"></i>已過期 ${s.vouchers_expired}</span>
      <span>共發出 ${s.vouchers_minted} 張</span>
    </div>`;
}

async function setStatus(s){
  try{ await api(`/campaigns/${CUR.id}`,{method:"PATCH",body:JSON.stringify({status:s})});
    toast("狀態已更新："+statusLabel(s));
    await loadCampaigns(); CUR=CAMPAIGNS.find(c=>c.id===CUR.id); renderCampaignList(); renderDetail();
  }catch(e){ toast("更新失敗："+e.message); }
}
async function saveSchedule(){
  // Blank field → null → patch_campaign ignores it (leaves the window unchanged).
  const body={ starts_at:tpeToIso($("eStarts").value), ends_at:tpeToIso($("eEnds").value) };
  try{ CUR=await api(`/campaigns/${CUR.id}`,{method:"PATCH",body:JSON.stringify(body)});
    toast("排程已更新"); renderDetail();
  }catch(e){ toast("更新失敗："+e.message); }
}
async function addPrize(){
  const name=$("pName").value.trim();
  if(!name){ toast("請填獎項名稱"); return; }
  const body={ name, weight:Number($("pWeight").value)||0, value_estimate:String($("pValue").value||"0") };
  const q=$("pQuota").value.trim(); if(q!=="") body.total_quota=Number(q);
  try{ await api(`/campaigns/${CUR.id}/prizes`,{method:"POST",body:JSON.stringify(body)});
    toast("獎項已新增"); renderDetail();
  }catch(e){ toast("新增失敗："+e.message); }
}
async function togglePrize(pid,active){
  try{ await api(`/campaigns/${CUR.id}/prizes/${pid}`,{method:"PATCH",body:JSON.stringify({is_active:active})});
    toast(active?"已啟用":"已停用"); renderDetail();
  }catch(e){ toast("更新失敗："+e.message); }
}
async function savePrize(pid){
  // Live-tune odds: weight + value always sent; quota only when a value is
  // entered (patch_prize ignores nulls, so blank means "leave unchanged").
  const body={ weight:Number($("w_"+pid).value)||0, value_estimate:String($("v_"+pid).value||"0") };
  const q=$("q_"+pid).value.trim(); if(q!=="") body.total_quota=Number(q);
  try{ await api(`/campaigns/${CUR.id}/prizes/${pid}`,{method:"PATCH",body:JSON.stringify(body)});
    toast("獎項已更新"); renderDetail();
  }catch(e){ toast("更新失敗："+e.message); }
}

async function lookupVoucher(){
  const code=$("rCode").value.trim().toUpperCase();
  const box=$("voucherBox");
  if(!code){ toast("請輸入券碼"); return; }
  try{
    const v=await api(`/campaigns/${CUR.id}/vouchers/by-code/${encodeURIComponent(code)}`);
    box.innerHTML=`
      <div style="border:1px solid var(--line);border-radius:12px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="big">${esc(v.prize_name)}</span>
          <span class="pill ${v.status}">${voucherStatus(v.status)}</span>
        </div>
        <div class="muted" style="margin:6px 0">價值 ${money(v.value_estimate)} · 有效 ${v.valid_from} ～ ${v.valid_until}</div>
        ${v.redeemed_at?`<div class="muted">已於 ${esc(v.redeemed_on||v.redeemed_at)} 核銷</div>`
          :`<button class="pink" onclick="redeem('${v.id}')" ${v.status!=='active'?'disabled':''}>✓ 確認核銷</button>`}
      </div>`;
  }catch(e){ box.innerHTML=`<div class="empty">查無此券或不可用：${esc(e.message)}</div>`; }
}
function voucherStatus(s){ return {active:"可核銷",redeemed:"已核銷",expired:"已過期"}[s]||s; }
async function redeem(vid){
  try{ const v=await api(`/campaigns/${CUR.id}/vouchers/${vid}/redeem`,{method:"POST",body:"{}"});
    toast("核銷成功 🎉"); $("rCode").value=""; lookupVoucherResult(v);
  }catch(e){ toast("核銷失敗："+e.message); }
}
function lookupVoucherResult(v){
  $("voucherBox").innerHTML=`<div style="border:1px solid var(--good);border-radius:12px;padding:14px">
    <span class="big">${esc(v.prize_name)}</span> <span class="pill redeemed">已核銷</span>
    <div class="muted" style="margin-top:6px">核銷時間 ${esc(v.redeemed_at)}</div></div>`;
}

boot();
</script>
</body>
</html>
