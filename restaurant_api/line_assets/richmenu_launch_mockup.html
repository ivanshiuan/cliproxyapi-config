<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>周霸虎 — 開幕上線版圖文選單視覺稿 (2500×843)</title>
<style>
  :root{ --bg:#1b1033; --line:#3a1d6e; --accent:#ffd34e; --accent2:#ff5d8f; --text:#f4f0ff; --muted:#b6a8da; }
  *{ box-sizing:border-box; margin:0; }
  body{ background:#0d0820; display:grid; place-items:center; min-height:100vh; padding:24px;
        font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif; }
  .hint{ color:#8a7bbf; font-size:14px; margin-bottom:14px; text-align:center; }
  /* 2500x843 等比縮放預覽（compact 模板，只有兩個真的能用的功能） */
  .menu{ width:1000px; height:337.2px; background:
      radial-gradient(120% 140% at 50% 0%, #3a1d6e 0%, var(--bg) 60%);
      display:grid; grid-template-columns:repeat(2,1fr);
      border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6);
      border:2px solid var(--line); }
  .cell{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:10px; padding:18px; border-right:2px solid var(--line); text-align:center; }
  .cell:last-child{ border-right:0; }
  .ico{ font-size:64px; line-height:1; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  .title{ color:var(--accent); font-weight:900; font-size:30px; }
  .sub{ color:var(--muted); font-size:16px; }
  .badge{ position:absolute; top:14px; right:14px; background:var(--accent2); color:#2a0e1f;
          font-weight:900; font-size:12px; padding:3px 10px; border-radius:999px; }
  .c1{ background:linear-gradient(160deg, rgba(255,93,143,.2), transparent 60%); }
  .note{ margin-top:14px; color:#8a7bbf; font-size:13px; text-align:center; max-width:1000px; }
</style>
</head>
<body>
  <div>
    <div class="hint">開幕上線版視覺稿 · 實際輸出 2500×843 PNG（此預覽為 1000px 等比縮小）</div>
    <div class="menu">
      <div class="cell c1"><span class="badge">天天抽</span><div class="ico">🎡</div><div class="title">開幕輪盤抽獎</div><div class="sub">每日一抽大獎</div></div>
      <div class="cell"><div class="ico">🎁</div><div class="title">我的獎品錢包</div><div class="sub">查看已中獎項</div></div>
    </div>
    <div class="note">兩格都連到同一個抽獎頁面 — 該頁面已經內建會員錢包顯示，玩過的會員回來看到的是自己的獎品錢包，不是重新抽獎。<br>菜單／訂位／點餐／官網等格子等官網頁面做好後再用 richmenu.json（6 格版）換上。</div>
  </div>
</body>
</html>
