<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TIGER LINE PRIME</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141922;
    --panel-2: #1c2230;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #f5a524;
    --accent-2: #ffb84d;
    --green: #4caf50;
    --red: #e05252;
    --border: #2a3244;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", sans-serif; -webkit-tap-highlight-color: transparent; }
  body { font-size: 15px; line-height: 1.5; }
  header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 0.5px; }
  header .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 15px; font-family: inherit; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .row.three { grid-template-columns: 1fr 1fr 1fr; }
  .row.full { grid-template-columns: 1fr; }
  .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  button { flex: 1; background: var(--accent); color: #111; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .checkbox input { width: auto; }
  #result { display: none; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .scenario { font-size: 20px; font-weight: 700; color: var(--accent-2); }
  .scenario.skip { color: var(--red); }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); font-size: 12px; margin-right: 4px; }
  .badge.up { background: rgba(76,175,80,0.15); color: var(--green); }
  .badge.down { background: rgba(224,82,82,0.15); color: var(--red); }
  .leg { padding: 10px; background: var(--panel-2); border-radius: 8px; margin-bottom: 8px; }
  .leg .sel { font-weight: 600; }
  .leg .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .list { margin: 0; padding-left: 20px; }
  .list li { margin-bottom: 4px; }
  .avoid li { color: var(--red); }
  .reserve li { color: var(--accent); }
  .disclaimer { font-size: 11px; color: var(--muted); line-height: 1.6; padding: 12px; background: var(--panel-2); border-radius: 8px; margin-top: 14px; white-space: pre-wrap; }
  .error { padding: 12px; background: rgba(224,82,82,0.1); border: 1px solid rgba(224,82,82,0.4); border-radius: 8px; color: var(--red); font-size: 13px; }
  .toggle-review { text-align: center; padding-top: 8px; }
  #review-panel { display: none; padding-top: 8px; }
  #review-result { display: none; }
</style>
</head>
<body>
<header>
  <h1>🐅 TIGER LINE PRIME</h1>
  <span class="tag">決策支援 · 非獲利承諾</span>
</header>

<main>
  <div class="card">
    <h2>載入範例</h2>
    <div class="row">
      <select id="example-select">
        <option value="">— 選一個範例 —</option>
      </select>
      <button class="ghost" id="load-example">載入</button>
    </div>
  </div>

  <div class="card">
    <h2>賽事</h2>
    <div class="row">
      <div><label>Match ID</label><input id="match_id" placeholder="2026-wc-belgium-newzealand" /></div>
      <div><label>開賽 UTC</label><input id="kickoff_utc" placeholder="2026-06-22T22:00:00+00:00" /></div>
    </div>
    <div class="row">
      <div><label>主隊</label><input id="home" placeholder="Belgium" /></div>
      <div><label>客隊</label><input id="away" placeholder="New Zealand" /></div>
    </div>
    <div class="row full">
      <div><label>積分概況</label><input id="standings_summary" placeholder="Belgium 3 pts, NZ 0 pts..." /></div>
    </div>
    <div class="row">
      <div class="checkbox"><input type="checkbox" id="final_round" /><label for="final_round">末輪</label></div>
      <div class="checkbox"><input type="checkbox" id="same_time_kickoff" /><label for="same_time_kickoff">同時開賽</label></div>
    </div>
  </div>

  <div class="card">
    <h2>戰意</h2>
    <div class="row">
      <div><label>主隊需求</label><select id="need_home"><option>must_win</option><option>draw_ok</option><option>rotation</option><option selected>neutral</option><option>unknown</option></select></div>
      <div><label>客隊需求</label><select id="need_away"><option>must_win</option><option>draw_ok</option><option selected>rotation</option><option>neutral</option><option>unknown</option></select></div>
    </div>
  </div>

  <div class="card">
    <h2>亞洲讓球盤</h2>
    <div class="row three">
      <div><label>Line</label><input id="ah_line" placeholder="-1.75" /></div>
      <div><label>Favorite</label><select id="ah_fav"><option value="home" selected>home</option><option value="away">away</option></select></div>
      <div></div>
    </div>
    <div class="row">
      <div><label>主隊價</label><input id="ah_home_price" placeholder="1.92" /></div>
      <div><label>客隊價</label><input id="ah_away_price" placeholder="1.90" /></div>
    </div>
  </div>

  <div class="card">
    <h2>大小盤</h2>
    <div class="row three">
      <div><label>Line</label><input id="tot_line" placeholder="3.0" /></div>
      <div><label>Over</label><input id="tot_over" placeholder="1.95" /></div>
      <div><label>Under</label><input id="tot_under" placeholder="1.87" /></div>
    </div>
  </div>

  <div class="card">
    <h2>本金</h2>
    <div class="row">
      <div><label>Bankroll (TWD)</label><input id="bankroll" placeholder="5000" /></div>
      <div></div>
    </div>
  </div>

  <div class="actions">
    <button id="analyze-btn">Analyze</button>
  </div>

  <div id="error-panel" style="display:none;margin-top:14px;" class="error"></div>

  <div id="result">
    <div class="card">
      <h2>Scenario</h2>
      <div id="scenario" class="scenario">—</div>
      <div style="margin-top:8px;">
        <span class="badge" id="confidence">confidence —</span>
        <span class="badge" id="harness">harness —</span>
      </div>
      <ul class="list" id="reasons" style="margin-top:10px;"></ul>
    </div>

    <div class="card">
      <h2>Score Corridor</h2>
      <div id="corridor">—</div>
    </div>

    <div class="card">
      <h2>Main Bet</h2>
      <div id="main-bet">—</div>
    </div>

    <div class="card">
      <h2>Secondary</h2>
      <div id="secondary">—</div>
    </div>

    <div class="card">
      <h2>Correct Score Sprinkles</h2>
      <div id="cs-legs">—</div>
    </div>

    <div class="card">
      <h2>Avoid</h2>
      <ul class="list avoid" id="avoid"></ul>
    </div>

    <div class="card">
      <h2>Reserve for Live</h2>
      <ul class="list reserve" id="reserve"></ul>
    </div>

    <div class="toggle-review">
      <button class="ghost" id="toggle-review">Post-match review</button>
    </div>

    <div id="review-panel">
      <div class="card">
        <h2>賽後比分</h2>
        <div class="row">
          <div><label>主隊進球</label><input id="hg" type="number" min="0" max="20" placeholder="5" /></div>
          <div><label>客隊進球</label><input id="ag" type="number" min="0" max="20" placeholder="1" /></div>
        </div>
        <div class="actions">
          <button id="review-btn">Review</button>
        </div>
      </div>
      <div id="review-result">
        <div class="card">
          <h2>Review</h2>
          <dl class="kv" id="review-kv"></dl>
          <ul class="list" id="review-suggestions" style="margin-top:10px;"></ul>
        </div>
      </div>
    </div>

    <div class="disclaimer" id="disclaimer"></div>
  </div>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
let currentPlan = null;
let currentMatch = null;

async function loadExamplesList() {
  try {
    const res = await fetch("/api/examples");
    const data = await res.json();
    const sel = $("example-select");
    for (const name of data.examples) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    }
  } catch (e) {
    console.warn("examples list failed", e);
  }
}

async function loadExample() {
  const name = $("example-select").value;
  if (!name) return;
  try {
    const res = await fetch(`/api/examples/${encodeURIComponent(name)}`);
    if (!res.ok) throw new Error(await res.text());
    const m = await res.json();
    fillForm(m);
  } catch (e) {
    showError("Load example failed: " + e.message);
  }
}

function fillForm(m) {
  $("match_id").value = m.match_id;
  $("kickoff_utc").value = m.kickoff_utc;
  $("home").value = m.home;
  $("away").value = m.away;
  $("standings_summary").value = m.group_context.standings_summary;
  $("final_round").checked = !!m.group_context.final_round;
  $("same_time_kickoff").checked = !!m.group_context.same_time_kickoff;
  $("need_home").value = m.team_need.home;
  $("need_away").value = m.team_need.away;
  $("ah_line").value = m.market.line;
  $("ah_fav").value = m.market.favorite;
  $("ah_home_price").value = m.market.home_price;
  $("ah_away_price").value = m.market.away_price;
  $("tot_line").value = m.totals.line;
  $("tot_over").value = m.totals.over_price;
  $("tot_under").value = m.totals.under_price;
  $("bankroll").value = m.bankroll;
}

function readForm() {
  return {
    match_id: $("match_id").value.trim(),
    kickoff_utc: $("kickoff_utc").value.trim(),
    home: $("home").value.trim(),
    away: $("away").value.trim(),
    group_context: {
      standings_summary: $("standings_summary").value.trim(),
      final_round: $("final_round").checked,
      same_time_kickoff: $("same_time_kickoff").checked,
    },
    team_need: {
      home: $("need_home").value,
      away: $("need_away").value,
    },
    market: {
      line: $("ah_line").value.trim(),
      favorite: $("ah_fav").value,
      home_price: $("ah_home_price").value.trim(),
      away_price: $("ah_away_price").value.trim(),
    },
    totals: {
      line: $("tot_line").value.trim(),
      over_price: $("tot_over").value.trim(),
      under_price: $("tot_under").value.trim(),
    },
    bankroll: $("bankroll").value.trim(),
    risk_flags: [],
  };
}

function showError(msg) {
  const el = $("error-panel");
  el.textContent = msg;
  el.style.display = "block";
  $("result").style.display = "none";
}

function clearError() {
  $("error-panel").style.display = "none";
}

async function analyze() {
  clearError();
  const btn = $("analyze-btn");
  btn.disabled = true;
  btn.textContent = "Analyzing…";
  const match = readForm();
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(match),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail ? JSON.stringify(err.detail) : `HTTP ${res.status}`);
    }
    const data = await res.json();
    currentPlan = data.plan;
    currentMatch = match;
    render(data);
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Analyze";
  }
}

function render(data) {
  $("result").style.display = "block";
  const scen = $("scenario");
  scen.textContent = data.scenario;
  scen.classList.toggle("skip", data.scenario === "rotation_trap" || data.harness === "skip");

  $("confidence").textContent = `confidence ${data.confidence}`;
  const harness = $("harness");
  harness.textContent = `harness ${data.harness}`;
  harness.className = "badge " + (data.harness === "upgrade" ? "up" : data.harness === "skip" ? "down" : "");

  const reasons = $("reasons");
  reasons.innerHTML = "";
  for (const r of data.reasons || []) {
    const li = document.createElement("li");
    li.textContent = r;
    reasons.appendChild(li);
  }

  const corr = data.corridor_scores.map(([h,a]) => `${h}-${a}`).join(" · ");
  const prim = data.corridor_primary && data.corridor_primary.length
    ? ` (primary ${data.corridor_primary[0]}-${data.corridor_primary[1]})` : "";
  $("corridor").textContent = corr + prim || "—";

  renderLeg($("main-bet"), data.plan.main_bet);
  renderLegs($("secondary"), data.plan.secondary);
  renderLegs($("cs-legs"), data.plan.correct_score);
  renderList($("avoid"), data.plan.avoid);
  renderList($("reserve"), data.plan.reserve_live);
  $("disclaimer").textContent = data.disclaimer;

  $("review-panel").style.display = "none";
  $("review-result").style.display = "none";
}

function renderLeg(el, leg) {
  if (!leg) { el.textContent = "— SKIP —"; return; }
  el.innerHTML = "";
  const box = document.createElement("div");
  box.className = "leg";
  const sel = document.createElement("div");
  sel.className = "sel";
  sel.textContent = leg.selection;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `${leg.market} · ${leg.level} · ${leg.stake_amount} (${leg.stake_pct} of bankroll)`;
  box.appendChild(sel); box.appendChild(meta);
  el.appendChild(box);
}

function renderLegs(el, legs) {
  el.innerHTML = "";
  if (!legs || !legs.length) { el.textContent = "—"; return; }
  for (const leg of legs) {
    const box = document.createElement("div");
    box.className = "leg";
    const sel = document.createElement("div");
    sel.className = "sel";
    sel.textContent = leg.selection;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${leg.market} · ${leg.level} · ${leg.stake_amount}`;
    box.appendChild(sel); box.appendChild(meta);
    el.appendChild(box);
  }
}

function renderList(el, items) {
  el.innerHTML = "";
  if (!items || !items.length) {
    const li = document.createElement("li");
    li.textContent = "—";
    li.style.color = "var(--muted)";
    el.appendChild(li);
    return;
  }
  for (const item of items) {
    const li = document.createElement("li");
    li.textContent = item;
    el.appendChild(li);
  }
}

async function submitReview() {
  if (!currentPlan || !currentMatch) return;
  const hg = parseInt($("hg").value, 10);
  const ag = parseInt($("ag").value, 10);
  if (Number.isNaN(hg) || Number.isNaN(ag)) { showError("請輸入雙方進球數"); return; }
  try {
    const res = await fetch("/api/review", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ match: currentMatch, plan: currentPlan, home_goals: hg, away_goals: ag }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail ? JSON.stringify(err.detail) : `HTTP ${res.status}`);
    }
    const data = await res.json();
    renderReview(data.result);
  } catch (e) {
    showError(e.message);
  }
}

function renderReview(r) {
  $("review-result").style.display = "block";
  const kv = $("review-kv");
  kv.innerHTML = "";
  const rows = [
    ["Actual", `${r.actual_score[0]}-${r.actual_score[1]}`],
    ["Scenario", r.scenario_correct ? "✓ correct" : "✗ drifted"],
    ["Corridor", r.corridor_hit ? "✓ hit" : "✗ missed"],
    ["Main", r.main_result],
    ["Score", `${r.score}/100`],
  ];
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    kv.appendChild(dt); kv.appendChild(dd);
  }
  const sug = $("review-suggestions");
  sug.innerHTML = "";
  for (const s of r.suggestions || []) {
    const li = document.createElement("li"); li.textContent = s; sug.appendChild(li);
  }
}

$("analyze-btn").addEventListener("click", analyze);
$("load-example").addEventListener("click", loadExample);
$("toggle-review").addEventListener("click", () => {
  const p = $("review-panel");
  p.style.display = p.style.display === "block" ? "none" : "block";
});
$("review-btn").addEventListener("click", submitReview);

loadExamplesList();
</script>
</body>
</html>
