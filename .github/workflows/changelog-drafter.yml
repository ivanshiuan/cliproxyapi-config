name: Changelog Drafter

on:
  push:
    branches: [claude/autonomous-resttech-enterprise-oW9jp]

permissions:
  contents: read

jobs:
  draft:
    # Skip loop-bot's own commits to avoid redundant runs
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Draft changelog (report-only, no commit/push)
        run: python scripts/draft_changelog.py

      - name: Write draft to job summary
        run: cat RELEASE_NOTES_DRAFT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changelog draft as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-draft
          path: RELEASE_NOTES_DRAFT.md