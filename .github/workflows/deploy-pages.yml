name: Deploy SID + tigerline to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/autonomous-resttech-enterprise-oW9jp
      - claude/tiger-line-prime-v2-d3i9g6
    paths:
      - 'sports-intelligence-desk/**'
      - 'tigerline-web/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build SID static site
        working-directory: sports-intelligence-desk
        run: node build.js

      - name: Run tigerline JS parity tests (17 cases, must be green before publishing)
        working-directory: tigerline-web
        run: node --test tests/*.test.js

      - name: Assemble combined Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          # SID at root — same URL SID has always used on github.io
          cp -r sports-intelligence-desk/dist/site/. _site/
          # Tigerline lives at /tigerline/ — relative asset paths (./css/, ./js/)
          # keep working because they're resolved relative to the served URL.
          mkdir -p _site/tigerline
          cp -r tigerline-web/. _site/tigerline/
          # Root index gets a little pointer so visitors hitting / see both.
          if ! grep -q "tigerline" _site/index.html 2>/dev/null; then :; fi
          ls -la _site _site/tigerline | head -30

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summarise URLs
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          {
            echo "### Deployed"
            echo ""
            echo "- SID:       ${BASE}"
            echo "- tigerline: ${BASE}tigerline/"
          } >> "$GITHUB_STEP_SUMMARY"
