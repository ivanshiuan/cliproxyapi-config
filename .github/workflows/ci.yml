name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    # Real Postgres + pgvector so we can run migrations and DB smoke against
    # the actual engine (catches SQL syntax / Alembic-autogen drift that
    # mock-only tests miss).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resto
          POSTGRES_PASSWORD: resto_dev_password
          POSTGRES_DB: resto_dev
          TZ: Asia/Taipei
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      RESTO_DB_HOST: localhost
      RESTO_DB_PORT: 5432
      RESTO_DB_USER: resto
      RESTO_DB_PASSWORD: resto_dev_password
      RESTO_DB_NAME: resto_dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pyright

      - name: Lint (ruff check)
        run: ruff check devswarm restaurant_api tests scripts

      - name: Type check (pyright)
        run: pyright

      - name: Initialise Postgres extensions
        env:
          PGPASSWORD: resto_dev_password
        run: |
          psql -h localhost -U resto -d resto_dev -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          psql -h localhost -U resto -d resto_dev -c 'CREATE EXTENSION IF NOT EXISTS "citext";'
          psql -h localhost -U resto -d resto_dev -c 'CREATE EXTENSION IF NOT EXISTS "pg_trgm";'
          psql -h localhost -U resto -d resto_dev -c 'CREATE EXTENSION IF NOT EXISTS "vector";'

      - name: Apply Alembic migrations
        working-directory: restaurant_api
        run: alembic upgrade head

      - name: Verify migrations match models (no drift)
        working-directory: restaurant_api
        run: alembic check

      - name: Scan migrations for unsafe ops (DROP COLUMN, NOT NULL, ...)
        run: python scripts/check_migration_safety.py

      - name: Export OpenAPI schema (validate it renders without error)
        run: python scripts/export_openapi.py --out /tmp/openapi.json

      - name: Run mock test suite (no API key needed)
        run: pytest tests/ -v --tb=short

      - name: Run real-DB smoke
        run: python scripts/smoke_db.py

      - name: Import smoke
        run: |
          python -c "from devswarm.graph import build_graph; print('DevSwarm OK')"
          python -c "from restaurant_api.main import app; print('Restaurant API OK')"
          python -c "from restaurant_api.models import Base; print('Tables:', len(Base.metadata.tables))"
