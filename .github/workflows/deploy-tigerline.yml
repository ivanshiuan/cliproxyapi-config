name: Deploy tigerline.pages.dev

# Trigger:
#  - Every push that touches tigerline-web/ on the working branch or main
#  - Manual run from the Actions tab (workflow_dispatch)
#
# One-time setup (Repo → Settings → Secrets and variables → Actions):
#  1. CLOUDFLARE_API_TOKEN  — Edit Cloudflare Workers template
#  2. CLOUDFLARE_ACCOUNT_ID — 340bb61ebfe2d5c8a83db337783254f7 (HOTPOT BUFF)

on:
  push:
    branches:
      - main
      - "claude/tiger-line-prime-*"
    paths:
      - "tigerline-web/**"
      - ".github/workflows/deploy-tigerline.yml"
  workflow_dispatch:

jobs:
  parity-tests:
    name: JS parity tests (must pass before deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run node:test parity suite
        working-directory: tigerline-web
        run: node --test tests/*.test.js

  deploy:
    name: wrangler pages deploy
    needs: parity-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy tigerline-web/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tigerline-web --project-name=tigerline --branch=main --commit-dirty=true
      - name: Summarise
        run: |
          echo "### tigerline.pages.dev updated" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://tigerline.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
