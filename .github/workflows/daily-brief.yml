name: Daily Brief

on:
  schedule:
    - cron: '0 0 * * 1-5'   # 00:00 UTC = 08:00 Taipei, Mon–Fri
  workflow_dispatch:           # Manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.CANONICAL_BRANCH || github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate brief (report-only, no commit/push)
        run: python scripts/morning_brief.py

      - name: Write to job summary
        run: cat LOOP_STATE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LOOP_STATE.md as artifact
        uses: actions/upload-artifact@v4
        with:
          name: loop-state
          path: LOOP_STATE.md
