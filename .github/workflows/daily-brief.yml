name: Daily Brief

on:
  schedule:
    - cron: '0 0 * * 1-5'   # 00:00 UTC = 08:00 Taipei, Mon–Fri
  workflow_dispatch:           # Manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/autonomous-resttech-enterprise-oW9jp
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate brief and update LOOP_STATE.md
        run: python scripts/morning_brief.py

      - name: Commit state
        run: |
          git config user.name  "loop-bot"
          git config user.email "loop@noreply.github.com"
          git add LOOP_STATE.md
          git diff --staged --quiet || (
            git commit -m "chore(loop): daily brief $(date -u +%Y-%m-%d) [skip ci]" &&
            git push origin claude/autonomous-resttech-enterprise-oW9jp
          )
